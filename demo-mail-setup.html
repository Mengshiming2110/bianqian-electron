<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>邮件设置 - 内嵌登录页</title>
<style>
:root {
  --bg-root: #050508;
  --bg-window: rgba(12,13,16,0.94);
  --bg-card: rgba(22,24,30,0.88);
  --bg-input: rgba(16,18,22,0.92);
  --bg-elevated: rgba(18,20,26,0.96);
  --text: #e8eaef;
  --text-secondary: #8b8f9a;
  --text-tertiary: #5c606d;
  --border: rgba(255,255,255,0.06);
  --accent: #5ebf9e;
  --accent-glow: rgba(94,191,158,0.18);
  --accent-dim: rgba(94,191,158,0.08);
  --danger: #e07373;
  --radius-window: 20px;
  --radius-card: 12px;
  --radius-sm: 8px;
  --radius-xs: 6px;
  --radius-full: 9999px;
  --ease-out-expo: cubic-bezier(0.16,1,0.3,1);
}
[data-theme="light"] {
  --bg-root: #f3f4f6;
  --bg-window: rgba(255,255,255,0.94);
  --bg-card: rgba(249,250,251,0.92);
  --bg-input: #fff;
  --bg-elevated: rgba(255,255,255,0.98);
  --text: #111318;
  --text-secondary: #6b6f7a;
  --text-tertiary: #9ca0ac;
  --border: rgba(0,0,0,0.06);
  --accent: #2f7d78;
  --accent-glow: rgba(47,125,120,0.14);
  --accent-dim: rgba(47,125,120,0.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Noto Sans CJK SC', sans-serif;
  font-size: 13px;
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  gap: 60px; padding: 40px; flex-wrap: wrap;
  background: var(--bg-root);
  transition: background 0.5s var(--ease-out-expo);
}
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 80% 60% at 20% 30%, rgba(94,191,158,0.04) 0%, transparent 60%),
    radial-gradient(ellipse 60% 70% at 80% 60%, rgba(94,120,191,0.03) 0%, transparent 60%);
}

/* ===== App Shell ===== */
.app-outer {
  position: relative; z-index: 1; padding: 2px;
  border-radius: calc(var(--radius-window) + 2px);
  background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02), rgba(255,255,255,0.06));
  box-shadow: 0 0 0 1px rgba(255,255,255,0.04), 0 24px 64px rgba(0,0,0,0.48), 0 8px 24px rgba(0,0,0,0.32);
}
[data-theme="light"] .app-outer {
  background: linear-gradient(135deg, rgba(0,0,0,0.04), rgba(0,0,0,0.01), rgba(0,0,0,0.04));
  box-shadow: 0 0 0 1px rgba(0,0,0,0.04), 0 24px 64px rgba(0,0,0,0.10), 0 8px 24px rgba(0,0,0,0.06);
}
.app-inner {
  width: 280px; border-radius: var(--radius-window);
  background: var(--bg-window);
  backdrop-filter: blur(40px) saturate(140%);
  -webkit-backdrop-filter: blur(40px) saturate(140%);
  overflow: hidden;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
}
[data-theme="light"] .app-inner { box-shadow: inset 0 1px 0 rgba(255,255,255,0.40); }

.app-shell {
  display: grid; grid-template-rows: auto 1fr auto;
  min-height: 420px;
}

/* Header */
.app-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 16px 8px;
}
.header-left .eyebrow {
  font-size: 10px; font-weight: 600; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--accent); margin-bottom: 1px;
}
.header-left h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; color: var(--text); }
.header-actions { display: flex; gap: 4px; }
.icon-btn {
  display: grid; width: 30px; height: 30px; place-items: center;
  border-radius: var(--radius-sm); border: none; background: var(--bg-card);
  color: var(--text-secondary); cursor: pointer;
  transition: all 0.2s var(--ease-out-expo);
}
.icon-btn svg { width: 15px; height: 15px; opacity: 0.7; }
.icon-btn:hover { background: var(--bg-card); color: var(--text); }
.icon-btn:hover svg { opacity: 1; }

/* ===== Login Card ===== */
.login-area {
  display: grid; place-items: center; padding: 12px 16px;
}

.login-card-outer {
  width: 100%; padding: 1px;
  border-radius: var(--radius-card);
  background: linear-gradient(135deg, rgba(94,191,158,0.10), transparent 50%, rgba(94,191,158,0.06));
}

.login-card {
  padding: 20px 18px;
  border-radius: calc(var(--radius-card) - 1px);
  background: var(--bg-card);
  border: 1px solid var(--border);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
}

.login-icon {
  width: 44px; height: 44px; border-radius: var(--radius-sm);
  background: var(--accent-dim); border: 1px solid rgba(94,191,158,0.12);
  display: grid; place-items: center; margin: 0 auto 12px;
}
.login-icon svg { width: 20px; height: 20px; color: var(--accent); }

.login-card h3 {
  text-align: center; font-size: 15px; font-weight: 600;
  color: var(--text); letter-spacing: -0.01em; margin-bottom: 4px;
}
.login-card > p {
  text-align: center; font-size: 11px; color: var(--text-secondary);
  line-height: 1.5; margin-bottom: 16px;
}

.field-group { display: flex; flex-direction: column; gap: 10px; }
.field { display: grid; gap: 4px; }
.field label {
  font-size: 11px; color: var(--text-tertiary); font-weight: 500;
}
.field input {
  width: 100%; height: 36px; padding: 0 12px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--bg-input); color: var(--text);
  font-size: 12px; font-family: inherit; outline: 0;
  transition: border-color 0.25s var(--ease-out-expo);
}
.field input:focus {
  border-color: rgba(94,191,158,0.40);
  box-shadow: 0 0 0 3px var(--accent-dim);
}
.field input::placeholder { color: var(--text-tertiary); }

/* Submit button — pill style */
.submit-btn {
  width: 100%; height: 40px; margin-top: 4px;
  border: none; border-radius: var(--radius-full);
  background: var(--accent); color: #0d1a16;
  font-size: 13px; font-weight: 600; font-family: inherit;
  cursor: pointer; letter-spacing: -0.01em;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: all 0.25s var(--ease-out-expo);
}
.submit-btn:hover { filter: brightness(1.06); transform: scale(1.01); }
.submit-btn:active { transform: scale(0.98); }

.submit-btn .arrow {
  width: 22px; height: 22px; border-radius: 50%;
  background: rgba(0,0,0,0.10);
  display: grid; place-items: center;
  transition: transform 0.25s var(--ease-out-expo);
}
.submit-btn:hover .arrow { transform: translateX(2px); }
.submit-btn .arrow svg { width: 12px; height: 12px; }

/* Error */
.error-msg {
  text-align: center; font-size: 11px; color: var(--danger);
  margin-top: 8px; min-height: 16px;
}

/* Footer link */
.login-footer {
  text-align: center; margin-top: 10px; font-size: 11px; color: var(--text-tertiary);
}
.login-footer a { color: var(--accent); text-decoration: none; cursor: pointer; }
.login-footer a:hover { text-decoration: underline; }

/* ===== Tab Bar ===== */
.tab-bar-outer { padding: 4px 12px 10px; }
.tab-bar {
  display: flex; gap: 2px; padding: 3px;
  border-radius: var(--radius-full); background: var(--bg-card);
  border: 1px solid var(--border);
}
.tab-btn {
  flex: 1; position: relative;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  height: 34px; padding: 0 8px;
  border: none; border-radius: var(--radius-full);
  background: transparent; color: var(--text-tertiary);
  font-size: 11px; font-weight: 500; font-family: inherit; cursor: pointer;
  transition: color 0.25s var(--ease-out-expo); letter-spacing: -0.01em;
}
.tab-btn svg { width: 15px; height: 15px; }
.tab-btn:hover { color: var(--text-secondary); }
.tab-btn.active { color: var(--text); font-weight: 600; }
.tab-btn.active::before {
  content: ''; position: absolute; inset: 2px;
  border-radius: var(--radius-full); background: var(--accent-glow);
  border: 1px solid rgba(94,191,158,0.12);
}

/* ===== State Toggle ===== */
.state-label {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 6px;
}
.state-btn {
  padding: 6px 14px; border: 1px solid var(--border); border-radius: var(--radius-full);
  background: var(--bg-card); color: var(--text-secondary);
  font-size: 11px; font-family: inherit; cursor: pointer;
  transition: all 0.2s var(--ease-out-expo);
}
.state-btn:hover { border-color: rgba(94,191,158,0.3); color: var(--text); }
.state-btn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); font-weight: 600; }

/* Theme toggle */
.theme-bar {
  position: fixed; top: 20px; right: 20px; display: flex; gap: 4px;
}
.theme-btn {
  padding: 5px 10px; border: 1px solid var(--border); border-radius: var(--radius-xs);
  background: var(--bg-card); color: var(--text-secondary);
  font-size: 11px; font-family: inherit; cursor: pointer;
  transition: all 0.15s var(--ease-out-expo);
}
.theme-btn:hover { border-color: rgba(94,191,158,0.3); }
.theme-btn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); font-weight: 600; }
</style>
</head>
<body>

<!-- SVG Icons -->
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="ic-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="ic-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="ic-minus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 12h14"/></symbol>
  <symbol id="ic-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></symbol>
  <symbol id="ic-notes" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect width="8" height="4" x="8" y="2" rx="2"/></symbol>
  <symbol id="ic-clipboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></symbol>
  <symbol id="ic-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></symbol>
  <symbol id="ic-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
</svg>

<!-- Theme -->
<div class="theme-bar">
  <button class="theme-btn on" onclick="setTheme('dark',this)">Dark</button>
  <button class="theme-btn" onclick="setTheme('light',this)">Light</button>
</div>

<div id="app-container">
<!-- ===== Login Form State ===== -->
<div class="app-outer">
  <div class="app-inner">
    <div class="app-shell">
      <header class="app-header">
        <div class="header-left">
          <p class="eyebrow">邮件</p>
          <h1>便签</h1>
        </div>
        <div class="header-actions">
          <button class="icon-btn"><svg><use href="#ic-settings"/></svg></button>
          <button class="icon-btn"><svg><use href="#ic-plus"/></svg></button>
          <button class="icon-btn"><svg><use href="#ic-minus"/></svg></button>
        </div>
      </header>

      <div class="login-area">
        <div class="login-card-outer">
          <div class="login-card">
            <div class="login-icon"><svg><use href="#ic-mail"/></svg></div>
            <h3>连接 Exchange</h3>
            <p>输入公司邮箱信息，自动拉取出货邮件</p>

            <div class="field-group">
              <div class="field">
                <label>Exchange 服务器</label>
                <input type="text" placeholder="mail.company.com" value="mail.company.com">
              </div>
              <div class="field">
                <label>邮箱地址</label>
                <input type="email" placeholder="zhang.wei@company.com" value="zhang.wei@company.com">
              </div>
              <div class="field">
                <label>密码</label>
                <input type="password" placeholder="········" value="········">
              </div>
              <button class="submit-btn">
                连接邮箱
                <span class="arrow"><svg><use href="#ic-arrow-right"/></svg></span>
              </button>
              <div class="error-msg"></div>
            </div>

            <div class="login-footer">
              <a>需要帮助？联系 IT 部门获取 Exchange 地址</a>
            </div>
          </div>
        </div>
      </div>

      <div class="tab-bar-outer">
        <div class="tab-bar">
          <button class="tab-btn"><svg><use href="#ic-notes"/></svg>便签</button>
          <button class="tab-btn"><svg><use href="#ic-clipboard"/></svg>剪切板</button>
          <button class="tab-btn active"><svg><use href="#ic-mail"/></svg>邮件</button>
        </div>
      </div>
    </div>
  </div>
</div>
</div>

<!-- Bottom state toggle -->
<div class="state-label">
  <span style="font-size:11px;color:var(--text-tertiary);margin-right:4px;display:flex;align-items:center">View:</span>
  <button class="state-btn on" onclick="showState('login')">未配置 · 登录表单</button>
  <button class="state-btn" onclick="showState('connected')">已连接 · 邮件列表</button>
</div>

<script>
function setTheme(t, btn) {
  document.querySelectorAll('[data-theme]').forEach(el => el.setAttribute('data-theme', t))
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('on'))
  if (btn) btn.classList.add('on')
}

function showState(state) {
  document.querySelectorAll('.state-btn').forEach(b => b.classList.remove('on'))
  event.target.classList.add('on')
  const container = document.getElementById('app-container')

  if (state === 'login') {
    container.innerHTML = document.querySelector('.app-outer').outerHTML
  } else {
    container.innerHTML = `<div class="app-outer"><div class="app-inner"><div class="app-shell" style="min-height:420px">
      <header class="app-header">
        <div class="header-left"><p class="eyebrow">邮件</p><h1>便签</h1></div>
        <div class="header-actions">
          <button class="icon-btn"><svg><use href="#ic-settings"/></svg></button>

          <button class="icon-btn"><svg><use href="#ic-minus"/></svg></button>
        </div>
      </header>

          <span style="width:5px;height:5px;border-radius:50%;background:var(--accent);display:inline-block"></span>
          <span style="font-size:10px">已连接</span>
        </div>
      </div>
      <div style="flex:1;overflow-y:auto;padding:0 12px;display:flex;flex-direction:column;gap:6px;min-height:0">
        <div style="padding:1px;border-radius:var(--radius-card);background:transparent;transition:background 0.25s var(--ease-out-expo)">
          <div style="padding:10px 11px;border-radius:calc(var(--radius-card) - 1px);background:var(--bg-card);border:1px solid var(--border);border-left:2px solid var(--accent);border-radius:0 var(--radius-card) var(--radius-card) 0;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,0.03)">
            <div style="display:flex;justify-content:space-between;margin-bottom:4px"><strong style="font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">出货确认单 2026-Q2-0182</strong><time style="font-size:10px;color:var(--text-tertiary);flex-shrink:0">10 分钟前</time></div>
            <div style="font-size:10px;color:var(--accent);margin-bottom:2px">zhang.wei@company.com</div>
            <div style="font-size:10px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">附件为Q2季度出货确认单，共3个批次，请查收并确认...</div>
          </div>
        </div>
        <div style="padding:1px;border-radius:var(--radius-card);background:transparent;transition:background 0.25s var(--ease-out-expo)">
          <div style="padding:10px 11px;border-radius:calc(var(--radius-card) - 1px);background:var(--bg-card);border:1px solid var(--border);cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,0.03)">
            <div style="display:flex;justify-content:space-between;margin-bottom:4px"><strong style="font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">标签系统更新通知</strong><time style="font-size:10px;color:var(--text-tertiary);flex-shrink:0">1 小时前</time></div>
            <div style="font-size:10px;color:var(--accent);margin-bottom:2px">system@company.com</div>
            <div style="font-size:10px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">标签系统将于本周五升级至 v3.2，新增字段...</div>
          </div>
        </div>
        <div style="padding:1px;border-radius:var(--radius-card);background:transparent;transition:background 0.25s var(--ease-out-expo)">
          <div style="padding:10px 11px;border-radius:calc(var(--radius-card) - 1px);background:var(--bg-card);border:1px solid var(--border);cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,0.03)">
            <div style="display:flex;justify-content:space-between;margin-bottom:4px"><strong style="font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Fwd: 客户反馈 - 德国市场 Q3 需求</strong><time style="font-size:10px;color:var(--text-tertiary);flex-shrink:0">2 小时前</time></div>
            <div style="font-size:10px;color:var(--accent);margin-bottom:2px">li.chen@company.com</div>
            <div style="font-size:10px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">转发德国客户对Q3订单的反馈意见，重点关注包装标准...</div>
          </div>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;padding:6px 16px;font-size:11px;color:var(--text-tertiary)"><span>5 封</span><span>06/21 周六</span></div>
      <div style="padding:4px 12px 10px"><div style="display:flex;gap:2px;padding:3px;border-radius:var(--radius-full);background:var(--bg-card);border:1px solid var(--border)">
        <button style="flex:1;position:relative;display:flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 8px;border:none;border-radius:var(--radius-full);background:transparent;color:var(--text-tertiary);font-size:11px;font-weight:500;font-family:inherit;cursor:pointer;letter-spacing:-0.01em"><svg style="width:15px;height:15px"><use href="#ic-notes"/></svg>便签</button>
        <button style="flex:1;position:relative;display:flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 8px;border:none;border-radius:var(--radius-full);background:transparent;color:var(--text-tertiary);font-size:11px;font-weight:500;font-family:inherit;cursor:pointer;letter-spacing:-0.01em"><svg style="width:15px;height:15px"><use href="#ic-clipboard"/></svg>剪切板</button>
        <button style="flex:1;position:relative;display:flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 8px;border:none;border-radius:var(--radius-full);background:transparent;color:var(--text);font-weight:600;font-family:inherit;cursor:pointer;letter-spacing:-0.01em"><svg style="width:15px;height:15px"><use href="#ic-mail"/></svg>邮件</button>
      </div></div>
    </div></div></div>`
  }
}
</script>
</body>
</html>
