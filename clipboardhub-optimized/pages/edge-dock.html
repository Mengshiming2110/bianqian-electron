/*
 * Pinguo design tokens
 * Brand: Pinguo
 * Domain: Consumer imaging product
 * Style: Restrained, elegant, Apple-inspired
 * Theme mode: light-dark
 * Source language: zh
 * Output language: en
 *
 * Color architecture (two layers):
 *   1. Primitive palette - six categories. brand / background / text / icon
 *      are each a 10-step scale (50 lightest to 900 darkest). state-success and
 *      state-error are functional colors anchored on Apple system colors.
 *      Anchors follow Apple Human Interface Guidelines system colors
 *      (System Blue #007AFF, System Green #34C759, System Red #FF3B30,
 *      system grays / label / background colors).
 *   2. Semantic tokens - :root (light) and .dark map roles onto primitives.
 *      Components and UI kits must only consume the semantic tokens below.
 */

/* @group-priority: brand, background, text, icon, state-success, state-error */

:root {
  
  /* solo-design consumption aliases: explicit prefix for fill-html-head.mjs */
  --apple-background: var(--background, #ffffff);
  --apple-foreground: var(--foreground, #0f172a);
  --apple-card: var(--card, var(--background));
  --apple-card-foreground: var(--card-foreground, var(--foreground));
  --apple-popover: var(--popover, var(--card));
  --apple-popover-foreground: var(--popover-foreground, var(--card-foreground, var(--foreground)));
  --apple-primary: var(--primary, #111827);
  --apple-primary-foreground: var(--primary-foreground, #ffffff);
  --apple-secondary: var(--secondary, var(--muted, var(--card)));
  --apple-secondary-foreground: var(--secondary-foreground, var(--foreground));
  --apple-muted: var(--muted, var(--card));
  --apple-muted-foreground: var(--muted-foreground, var(--foreground));
  --apple-accent: var(--accent, var(--secondary, var(--muted, var(--card))));
  --apple-accent-foreground: var(--accent-foreground, var(--foreground));
  --apple-destructive: var(--destructive, #ef4444);
  --apple-destructive-foreground: var(--destructive-foreground, #ffffff);
  --apple-border: var(--border, currentColor);
  --apple-input: var(--input, var(--border));
  --apple-ring: var(--ring, var(--primary));
  --apple-chart-1: var(--chart-1, var(--primary));
  --apple-chart-2: var(--chart-2, var(--secondary, var(--primary)));
  --apple-chart-3: var(--chart-3, var(--accent, var(--primary)));
  --apple-chart-4: var(--chart-4, var(--muted-foreground, var(--foreground)));
  --apple-chart-5: var(--chart-5, var(--foreground));
  --apple-sidebar: var(--sidebar, var(--background));
  --apple-sidebar-foreground: var(--sidebar-foreground, var(--foreground));
  --apple-sidebar-primary: var(--sidebar-primary, var(--primary));
  --apple-sidebar-primary-foreground: var(--sidebar-primary-foreground, var(--primary-foreground));
  --apple-sidebar-accent: var(--sidebar-accent, var(--accent, var(--muted, var(--card))));
  --apple-sidebar-accent-foreground: var(--sidebar-accent-foreground, var(--accent-foreground, var(--foreground)));

/* ===== PRIMITIVE PALETTE ===== */

  /* brand */
  --brand-50: #e8f2ff;
  --brand-100: #cfe5ff;
  --brand-200: #9fcbff;
  --brand-300: #66abff;
  --brand-400: #2e8dff;
  --brand-500: #007aff; /* @primary */
  --brand-600: #0064d6;
  --brand-700: #004fad;
  --brand-800: #003b82;
  --brand-900: #00275a;

  /* background */
  --background-50: #ffffff;
  --background-100: #f7f7fa;
  --background-200: #f2f2f7;
  --background-300: #e5e5ea;
  --background-400: #d1d1d6;
  --background-500: #aeaeb2;
  --background-600: #8e8e93;
  --background-700: #3a3a3c;
  --background-800: #1c1c1e;
  --background-900: #000000;

  /* text */
  --text-50: #f5f5f7;
  --text-100: #e3e3e8;
  --text-200: #c7c7cc;
  --text-300: #aeaeb2;
  --text-400: #8e8e93;
  --text-500: #6e6e73;
  --text-600: #48484a;
  --text-700: #3c3c43;
  --text-800: #1d1d1f;
  --text-900: #000000;

  /* icon */
  --icon-50: #f5f5f7;
  --icon-100: #e5e5ea;
  --icon-200: #d1d1d6;
  --icon-300: #c7c7cc;
  --icon-400: #aeaeb2;
  --icon-500: #8e8e93;
  --icon-600: #6e6e73;
  --icon-700: #48484a;
  --icon-800: #2c2c2e;
  --icon-900: #1d1d1f;

  /* state-success */
  --state-success: #34c759; /* @primary */
  --state-success-dark: #30d158;
  --state-success-surface: #e9f9ee;
  --state-success-foreground: #ffffff;

  /* state-error */
  --state-error: #ff3b30; /* @primary */
  --state-error-dark: #ff453a;
  --state-error-surface: #ffecea;
  --state-error-foreground: #ffffff;

  /* ===== SEMANTIC ROLES ===== */

  /* semantic */
  --background: var(--background-50);
  --foreground: var(--text-800);
  --card: var(--background-50);
  --card-foreground: var(--text-800);
  --popover: var(--background-50);
  --popover-foreground: var(--text-900);

  --primary: var(--brand-500);
  --primary-foreground: var(--background-50);
  --secondary: var(--background-200);
  --secondary-foreground: var(--text-800);
  --muted: var(--background-200);
  --muted-foreground: var(--text-400);
  --accent: var(--background-100);
  --accent-foreground: var(--text-800);
  --destructive: var(--state-error);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-300);
  --input: var(--background-400);
  --ring: var(--brand-500);

  --icon: var(--icon-900);
  --icon-muted: var(--icon-500);

  /* chart */
  --chart-1: var(--state-success);
  --chart-2: var(--brand-500);
  --chart-3: #ff9500;
  --chart-4: #5856d6;
  --chart-5: #af52de;

  /* sidebar */
  --sidebar: var(--background-200);
  --sidebar-foreground: var(--text-800);
  --sidebar-primary: var(--brand-500);
  --sidebar-primary-foreground: var(--background-50);
  --sidebar-accent: var(--background-300);
  --sidebar-accent-foreground: var(--text-800);
  --sidebar-border: var(--background-300);
  --sidebar-ring: var(--brand-500);

  /* TYPOGRAPHY */
  --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;
  --tracking-normal: 0em;

  /* RADIUS */
  --radius: 1.2rem;

  /* SHADOWS */
  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.04); /* Hairline */
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04); /* Subtle */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05), 0 1px 3px -1px rgba(0, 0, 0, 0.05); /* Card */
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.05); /* Raised */
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.05); /* Card Hover */
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.08), 0 4px 8px -4px rgba(0, 0, 0, 0.05); /* Float */
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.10), 0 8px 16px -8px rgba(0, 0, 0, 0.06); /* Overlay */
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.12); /* Modal */

  /* SPACING */
  --spacing: 0.24rem;
}

/* ===== SEMANTIC ROLES - dark (primitive palette inherited) ===== */
.dark {
  --background: var(--background-900);
  --foreground: var(--text-50);
  --card: var(--background-800);
  --card-foreground: var(--text-50);
  --popover: var(--background-700);
  --popover-foreground: var(--text-50);

  --primary: var(--brand-400);
  --primary-foreground: var(--background-900);
  --secondary: var(--background-800);
  --secondary-foreground: var(--text-50);
  --muted: var(--background-800);
  --muted-foreground: var(--text-400);
  --accent: var(--background-700);
  --accent-foreground: var(--text-50);
  --destructive: var(--state-error-dark);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success-dark);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-700);
  --input: var(--background-700);
  --ring: var(--brand-400);

  --icon: var(--icon-50);
  --icon-muted: var(--icon-500);

  --chart-1: var(--state-success-dark);
  --chart-2: var(--brand-400);
  --chart-3: #ff9f0a;
  --chart-4: #5e5ce6;
  --chart-5: #bf5af2;

  --sidebar: var(--background-800);
  --sidebar-foreground: var(--text-50);
  --sidebar-primary: var(--brand-400);
  --sidebar-primary-foreground: var(--background-900);
  --sidebar-accent: var(--background-700);
  --sidebar-accent-foreground: var(--text-50);
  --sidebar-border: var(--background-700);
  --sidebar-ring: var(--brand-400);

  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.30);
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.30);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.36), 0 1px 3px -1px rgba(0, 0, 0, 0.36);
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.40), 0 1px 2px -1px rgba(0, 0, 0, 0.36);
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.44), 0 2px 4px -2px rgba(0, 0, 0, 0.36);
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.50), 0 4px 8px -4px rgba(0, 0, 0, 0.40);
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.55), 0 8px 16px -8px rgba(0, 0, 0, 0.44);
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.60);
}

/* radius semantic bridge - derived from Library --radius (1.2rem = 19.2px) */:root {
  --apple-radius-sm: calc(var(--radius) * 0.42);
  --apple-radius-md: calc(var(--radius) * 0.75);
  --apple-radius-lg: var(--radius);
}

      /* ===== 无运行时稳定性：壳层、页头、桌面画布、贴边/唤出窗口 ===== */
      body{margin:0;background:var(--apple-background);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
      .app-frame{width:400px;min-height:640px;margin-inline:auto;background:var(--apple-background);box-shadow:var(--shadow-lg);display:flex;flex-direction:column}
      .app-header{padding:16px 16px 10px}
      .app-content{flex:1;padding:0 16px 24px;min-width:0}
      .header-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
      .page-title{margin:0;font-size:16px;font-weight:600;line-height:1.25;color:var(--apple-foreground)}
      .page-subtitle{margin:2px 0 0;font-size:11px;color:var(--apple-muted-foreground)}
      .hint-chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 10px;border-radius:999px;background:var(--apple-secondary);color:var(--apple-muted-foreground);font-size:10px;white-space:nowrap;flex:none}
      .hint-chip svg{width:12px;height:12px}

      /* 区块标题 */
      .demo-section,.reveal-section{margin-top:12px}
      .section-label{margin:0 2px 8px;font-size:12px;font-weight:500;color:var(--apple-foreground)}

      /* 桌面画布：浅色渐变模拟桌面 */
      .desktop-canvas{position:relative;height:196px;border-radius:var(--apple-radius-lg);overflow:hidden;border:1px solid var(--apple-border);background:linear-gradient(160deg,var(--apple-secondary) 0%,var(--apple-accent) 100%)}
      .desk-window{position:absolute;background:var(--apple-card);border:1px solid var(--apple-border);border-radius:12px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;overflow:hidden}
      .win-bar{height:10px;display:flex;align-items:center;gap:3px;padding:0 6px}
      .win-dot{width:4px;height:4px;border-radius:999px;background:var(--apple-muted-foreground)}
      .win-line{height:4px;border-radius:999px;background:var(--apple-secondary);margin:3px 8px}
      .win-line.is-short{width:62%}
      .desk-window-a{top:18px;left:18px;width:104px;height:72px;opacity:.92}
      .desk-window-b{top:52px;left:98px;width:122px;height:88px;opacity:.78}

      /* 贴边窗口（DOCKED）：滑出画布外，仅露 4px 细边 + 胶囊把手 */
      .dock-window{position:absolute;top:26px;right:-268px;width:272px;height:150px;border-radius:14px;border:1px solid var(--apple-border);background:color-mix(in srgb,var(--apple-card) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:var(--shadow-lg)}
      .dock-grip{position:absolute;left:-15px;top:50%;transform:translateY(-50%);width:17px;height:46px;border-radius:999px;background:var(--apple-card);border:1px solid var(--apple-border);box-shadow:var(--shadow-md);display:flex;align-items:center;justify-content:center;color:var(--apple-muted-foreground)}
      .dock-grip svg{width:12px;height:12px}
      .canvas-tag{position:absolute;left:10px;bottom:8px;height:20px;padding:0 8px;border-radius:999px;background:color-mix(in srgb,var(--apple-card) 72%,transparent);border:1px solid var(--apple-border);display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--apple-muted-foreground)}
      .canvas-tag svg{width:11px;height:11px}

      /* 唤出态窗口：完全可见 240px */
      .reveal-scene{position:relative;display:flex;justify-content:flex-end;padding:14px 14px 16px;background:linear-gradient(160deg,var(--apple-secondary) 0%,var(--apple-accent) 100%);border:1px solid var(--apple-border);border-radius:var(--apple-radius-lg);overflow:hidden}
      .reveal-window{width:280px;border-radius:14px;border:1px solid var(--apple-border);background:color-mix(in srgb,var(--apple-card) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:var(--shadow-lg);overflow:hidden}
      .reveal-topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--apple-border)}
      .reveal-title{margin:0;font-size:13px;font-weight:600;color:var(--apple-foreground)}
      .reveal-hint{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--apple-muted-foreground);white-space:nowrap}
      .reveal-hint svg{width:12px;height:12px}
      .note-card{display:flex;align-items:center;gap:10px;margin:12px;padding:10px;background:var(--apple-card);border:1px solid var(--apple-border);border-radius:var(--apple-radius-md);box-shadow:var(--shadow-xs)}
      .note-thumb{width:34px;height:34px;border-radius:var(--apple-radius-lg);background:var(--apple-secondary);display:flex;align-items:center;justify-content:center;flex:none}
      .note-thumb svg{width:15px;height:15px;color:var(--apple-muted-foreground)}
      .note-main{flex:1;min-width:0}
      .note-title{margin:0;font-size:12px;font-weight:500;color:var(--apple-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .note-meta{margin:2px 0 0;font-size:10px;color:var(--apple-muted-foreground)}
      .pin-btn{width:28px;height:28px;padding:0;border:0;border-radius:999px;background:transparent;color:var(--apple-muted-foreground);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
      .pin-btn svg{width:14px;height:14px}

      /* 状态说明卡 */
      .status-card{margin-top:20px;padding:12px;background:var(--apple-card);border:1px solid var(--apple-border);border-radius:var(--apple-radius-lg);box-shadow:var(--shadow-xs)}
      .badge-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
      .badge{height:22px;padding:0 10px;border-radius:999px;display:inline-flex;align-items:center;font-size:12px;font-weight:500;letter-spacing:.2px}
      .badge-on{background:color-mix(in srgb,var(--apple-primary) 12%,var(--apple-card));color:var(--apple-primary);border:1px solid color-mix(in srgb,var(--apple-primary) 32%,transparent)}
      .badge-off{background:var(--apple-secondary);color:var(--apple-muted-foreground);border:1px solid var(--apple-border)}
      .status-list{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
      .status-item{display:flex;align-items:flex-start;gap:8px;font-size:11px;color:var(--apple-foreground);line-height:1.45}
      .status-item svg{width:14px;height:14px;flex:none;margin-top:1px;color:var(--apple-muted-foreground)}
      .s-name{font-weight:600}

      /* 切换栏 */
      .toggle-bar{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--apple-border);background:var(--apple-card)}
      .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
      .toggle-label{display:flex;flex-direction:column;gap:2px;font-size:13px;font-weight:500;color:var(--apple-foreground)}
      .toggle-sub{font-size:10px;color:var(--apple-muted-foreground);font-weight:400}
      .switch{position:relative;width:46px;height:26px;border-radius:999px;border:0;padding:0;background:var(--apple-primary);cursor:pointer;flex:none}
      .switch-knob{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:999px;background:var(--apple-primary-foreground);box-shadow:var(--shadow-sm)}
    </style>
    <style id="page-styles">
      /* ===== 交互增强与动效（运行时仅做增强） ===== */
      .dock-grip{transition:background-color .15s,color .15s,box-shadow .15s}
      .reveal-window{transition:transform .2s cubic-bezier(.32,.72,0,1),border-color .2s cubic-bezier(.32,.72,0,1)}
      .switch{transition:background-color .18s}
      .switch:active .switch-knob{transform:scale(.92)}
      .pin-btn{transition:color .15s,background-color .15s,transform .15s}
      .pin-btn:active{transform:scale(.94)}
      /* ===== 桌面 hover：仅指针设备生效 ===== */
      @media (hover: hover) and (pointer: fine) {
        .dock-grip:hover{color:var(--apple-primary);box-shadow:var(--shadow-lg)}
        .dock-window:hover{border-color:var(--apple-accent)}
        .reveal-window:hover{transform:translateX(-4px);border-color:var(--apple-accent)}
        .pin-btn:hover{background:var(--apple-secondary);color:var(--apple-primary)}
      }
      /* ===== 键盘可达性 ===== */
      .switch:focus-visible,.pin-btn:focus-visible,button:focus-visible{outline:2px solid var(--apple-ring);outline-offset:2px}
      @media (prefers-reduced-motion: reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
    </style>
    <div class="app-frame" id="app-frame">
      <header class="app-header">
        <div class="header-row">
          <div>
            <h1 class="page-title">边缘吸附</h1>
            <p class="page-subtitle">贴边收纳 · 桌面窗口</p>
          </div>
          <span class="hint-chip"><i data-lucide="mouse-pointer-2" aria-hidden="true"></i>鼠标碰边缘唤出</span>
        </div>
      </header>
      <div class="app-content">
        <section class="demo-section" aria-label="桌面画布与贴边窗口演示">
          <h2 class="section-label">桌面 · DOCKED 贴边</h2>
          <div class="desktop-canvas" role="img" aria-label="桌面画布上右侧贴边的剪切板窗口，仅露出 4px 细边与胶囊把手">
            <div class="desk-window desk-window-a" aria-hidden="true">
              <div class="win-bar"><span class="win-dot"></span><span class="win-dot"></span><span class="win-dot"></span></div>
              <div class="win-line"></div>
              <div class="win-line is-short"></div>
            </div>
            <div class="desk-window desk-window-b" aria-hidden="true">
              <div class="win-bar"><span class="win-dot"></span><span class="win-dot"></span><span class="win-dot"></span></div>
              <div class="win-line"></div>
              <div class="win-line"></div>
              <div class="win-line is-short"></div>
            </div>
            <div class="dock-window" aria-hidden="true">
              <div class="dock-grip"><i data-lucide="chevron-left" aria-hidden="true"></i></div>
            </div>
            <span class="canvas-tag"><i data-lucide="panel-left" aria-hidden="true"></i>仅露 4px · 碰边缘唤出</span>
          </div>
        </section>
        <section class="reveal-section" aria-label="唤出态窗口演示">
          <h2 class="section-label">唤出 · 鼠标碰边缘弹出</h2>
          <div class="reveal-scene">
            <div class="reveal-window">
              <div class="reveal-topbar">
                <h3 class="reveal-title">贴边收纳中</h3>
                <span class="reveal-hint"><i data-lucide="mouse-pointer-2" aria-hidden="true"></i>鼠标碰边缘唤出</span>
              </div>
              <div class="note-card">
                <div class="note-thumb"><i data-lucide="sticky-note" aria-hidden="true"></i></div>
                <div class="note-main">
                  <p class="note-title">设计评审 周二 14:00 · A 会议室</p>
                  <p class="note-meta">便签 · 刚刚复制</p>
                </div>
                <button class="pin-btn" type="button" aria-label="固定" title="固定"><i data-lucide="pin" aria-hidden="true"></i></button>
              </div>
            </div>
          </div>
        </section>
        <section class="status-card" aria-label="边缘吸附状态说明">
          <div class="badge-row">
            <span class="badge badge-off">NORMAL</span>
            <span class="badge badge-on">DOCKED</span>
            <span class="badge badge-off">HIDDEN</span>
          </div>
          <ul class="status-list">
            <li class="status-item"><i data-lucide="panel-left" aria-hidden="true"></i><span><b class="s-name">贴边</b>：拖到屏幕边缘自动吸附</span></li>
            <li class="status-item"><i data-lucide="chevron-left" aria-hidden="true"></i><span><b class="s-name">收纳</b>：鼠标离开 500ms 后自动收起</span></li>
            <li class="status-item"><i data-lucide="mouse-pointer-2" aria-hidden="true"></i><span><b class="s-name">唤出</b>：鼠标碰屏幕边缘弹出</span></li>
          </ul>
        </section>
      </div>
      <div class="toggle-bar">
        <div class="toggle-row">
          <span class="toggle-label">切换贴边收纳<span class="toggle-sub">开启后窗口贴边自动收纳</span></span>
          <button class="switch" type="button" role="switch" aria-checked="true" aria-label="切换贴边收纳" title="切换贴边收纳"><span class="switch-knob"></span></button>
        </div>
      </div>
    </div>
  </main>
    <script>lucide.createIcons();</script>
</body>
</html>
