    <style id="theme-vars">
/*
 * Pinguo design tokens
 * Brand: Pinguo
 * Domain: Consumer imaging product
 * Style: Restrained, elegant, Apple-inspired
 * Theme mode: light-dark
 * Source language: zh
 * Output language: en
 *
 * Color architecture (two layers):
 *   1. Primitive palette - six categories. brand / background / text / icon
 *      are each a 10-step scale (50 lightest to 900 darkest). state-success and
 *      state-error are functional colors anchored on Apple system colors.
 *      Anchors follow Apple Human Interface Guidelines system colors
 *      (System Blue #007AFF, System Green #34C759, System Red #FF3B30,
 *      system grays / label / background colors).
 *   2. Semantic tokens - :root (light) and .dark map roles onto primitives.
 *      Components and UI kits must only consume the semantic tokens below.
 */

/* @group-priority: brand, background, text, icon, state-success, state-error */

:root {
  
  /* solo-design consumption aliases: explicit prefix for fill-html-head.mjs */
  --apple-background: var(--background, #ffffff);
  --apple-foreground: var(--foreground, #0f172a);
  --apple-card: var(--card, var(--background));
  --apple-card-foreground: var(--card-foreground, var(--foreground));
  --apple-popover: var(--popover, var(--card));
  --apple-popover-foreground: var(--popover-foreground, var(--card-foreground, var(--foreground)));
  --apple-primary: var(--primary, #111827);
  --apple-primary-foreground: var(--primary-foreground, #ffffff);
  --apple-secondary: var(--secondary, var(--muted, var(--card)));
  --apple-secondary-foreground: var(--secondary-foreground, var(--foreground));
  --apple-muted: var(--muted, var(--card));
  --apple-muted-foreground: var(--muted-foreground, var(--foreground));
  --apple-accent: var(--accent, var(--secondary, var(--muted, var(--card))));
  --apple-accent-foreground: var(--accent-foreground, var(--foreground));
  --apple-destructive: var(--destructive, #ef4444);
  --apple-destructive-foreground: var(--destructive-foreground, #ffffff);
  --apple-border: var(--border, currentColor);
  --apple-input: var(--input, var(--border));
  --apple-ring: var(--ring, var(--primary));
  --apple-chart-1: var(--chart-1, var(--primary));
  --apple-chart-2: var(--chart-2, var(--secondary, var(--primary)));
  --apple-chart-3: var(--chart-3, var(--accent, var(--primary)));
  --apple-chart-4: var(--chart-4, var(--muted-foreground, var(--foreground)));
  --apple-chart-5: var(--chart-5, var(--foreground));
  --apple-sidebar: var(--sidebar, var(--background));
  --apple-sidebar-foreground: var(--sidebar-foreground, var(--foreground));
  --apple-sidebar-primary: var(--sidebar-primary, var(--primary));
  --apple-sidebar-primary-foreground: var(--sidebar-primary-foreground, var(--primary-foreground));
  --apple-sidebar-accent: var(--sidebar-accent, var(--accent, var(--muted, var(--card))));
  --apple-sidebar-accent-foreground: var(--sidebar-accent-foreground, var(--accent-foreground, var(--foreground)));

/* ===== PRIMITIVE PALETTE ===== */

  /* brand */
  --brand-50: #e8f2ff;
  --brand-100: #cfe5ff;
  --brand-200: #9fcbff;
  --brand-300: #66abff;
  --brand-400: #2e8dff;
  --brand-500: #007aff; /* @primary */
  --brand-600: #0064d6;
  --brand-700: #004fad;
  --brand-800: #003b82;
  --brand-900: #00275a;

  /* background */
  --background-50: #ffffff;
  --background-100: #f7f7fa;
  --background-200: #f2f2f7;
  --background-300: #e5e5ea;
  --background-400: #d1d1d6;
  --background-500: #aeaeb2;
  --background-600: #8e8e93;
  --background-700: #3a3a3c;
  --background-800: #1c1c1e;
  --background-900: #000000;

  /* text */
  --text-50: #f5f5f7;
  --text-100: #e3e3e8;
  --text-200: #c7c7cc;
  --text-300: #aeaeb2;
  --text-400: #8e8e93;
  --text-500: #6e6e73;
  --text-600: #48484a;
  --text-700: #3c3c43;
  --text-800: #1d1d1f;
  --text-900: #000000;

  /* icon */
  --icon-50: #f5f5f7;
  --icon-100: #e5e5ea;
  --icon-200: #d1d1d6;
  --icon-300: #c7c7cc;
  --icon-400: #aeaeb2;
  --icon-500: #8e8e93;
  --icon-600: #6e6e73;
  --icon-700: #48484a;
  --icon-800: #2c2c2e;
  --icon-900: #1d1d1f;

  /* state-success */
  --state-success: #34c759; /* @primary */
  --state-success-dark: #30d158;
  --state-success-surface: #e9f9ee;
  --state-success-foreground: #ffffff;

  /* state-error */
  --state-error: #ff3b30; /* @primary */
  --state-error-dark: #ff453a;
  --state-error-surface: #ffecea;
  --state-error-foreground: #ffffff;

  /* ===== SEMANTIC ROLES ===== */

  /* semantic */
  --background: var(--background-50);
  --foreground: var(--text-800);
  --card: var(--background-50);
  --card-foreground: var(--text-800);
  --popover: var(--background-50);
  --popover-foreground: var(--text-900);

  --primary: var(--brand-500);
  --primary-foreground: var(--background-50);
  --secondary: var(--background-200);
  --secondary-foreground: var(--text-800);
  --muted: var(--background-200);
  --muted-foreground: var(--text-400);
  --accent: var(--background-100);
  --accent-foreground: var(--text-800);
  --destructive: var(--state-error);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-300);
  --input: var(--background-400);
  --ring: var(--brand-500);

  --icon: var(--icon-900);
  --icon-muted: var(--icon-500);

  /* chart */
  --chart-1: var(--state-success);
  --chart-2: var(--brand-500);
  --chart-3: #ff9500;
  --chart-4: #5856d6;
  --chart-5: #af52de;

  /* sidebar */
  --sidebar: var(--background-200);
  --sidebar-foreground: var(--text-800);
  --sidebar-primary: var(--brand-500);
  --sidebar-primary-foreground: var(--background-50);
  --sidebar-accent: var(--background-300);
  --sidebar-accent-foreground: var(--text-800);
  --sidebar-border: var(--background-300);
  --sidebar-ring: var(--brand-500);

  /* TYPOGRAPHY */
  --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;
  --tracking-normal: 0em;

  /* RADIUS */
  --radius: 1.2rem;

  /* SHADOWS */
  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.04); /* Hairline */
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04); /* Subtle */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05), 0 1px 3px -1px rgba(0, 0, 0, 0.05); /* Card */
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.05); /* Raised */
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.05); /* Card Hover */
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.08), 0 4px 8px -4px rgba(0, 0, 0, 0.05); /* Float */
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.10), 0 8px 16px -8px rgba(0, 0, 0, 0.06); /* Overlay */
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.12); /* Modal */

  /* SPACING */
  --spacing: 0.24rem;
}

/* ===== SEMANTIC ROLES - dark (primitive palette inherited) ===== */
.dark {
  --background: var(--background-900);
  --foreground: var(--text-50);
  --card: var(--background-800);
  --card-foreground: var(--text-50);
  --popover: var(--background-700);
  --popover-foreground: var(--text-50);

  --primary: var(--brand-400);
  --primary-foreground: var(--background-900);
  --secondary: var(--background-800);
  --secondary-foreground: var(--text-50);
  --muted: var(--background-800);
  --muted-foreground: var(--text-400);
  --accent: var(--background-700);
  --accent-foreground: var(--text-50);
  --destructive: var(--state-error-dark);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success-dark);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-700);
  --input: var(--background-700);
  --ring: var(--brand-400);

  --icon: var(--icon-50);
  --icon-muted: var(--icon-500);

  --chart-1: var(--state-success-dark);
  --chart-2: var(--brand-400);
  --chart-3: #ff9f0a;
  --chart-4: #5e5ce6;
  --chart-5: #bf5af2;

  --sidebar: var(--background-800);
  --sidebar-foreground: var(--text-50);
  --sidebar-primary: var(--brand-400);
  --sidebar-primary-foreground: var(--background-900);
  --sidebar-accent: var(--background-700);
  --sidebar-accent-foreground: var(--text-50);
  --sidebar-border: var(--background-700);
  --sidebar-ring: var(--brand-400);

  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.30);
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.30);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.36), 0 1px 3px -1px rgba(0, 0, 0, 0.36);
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.40), 0 1px 2px -1px rgba(0, 0, 0, 0.36);
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.44), 0 2px 4px -2px rgba(0, 0, 0, 0.36);
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.50), 0 4px 8px -4px rgba(0, 0, 0, 0.40);
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.55), 0 8px 16px -8px rgba(0, 0, 0, 0.44);
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.60);
}

/* radius semantic bridge - derived from Library --radius (1.2rem = 19.2px) */:root {
  --apple-radius-sm: calc(var(--radius) * 0.42);
  --apple-radius-md: calc(var(--radius) * 0.75);
  --apple-radius-lg: var(--radius);
}

        <style id="critical-layout">
          /* ===== 附件查看器工具窗：静态布局（不依赖运行时） ===== */
          body {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 24px;
            min-height: 100vh;
            background: var(--apple-background);
            color: var(--apple-foreground);
          }
          main { display: contents; }

          /* 窗口框架：560×450 独立工具窗，浮于桌面 */
          .win-frame {
            width: 560px;
            max-width: calc(100vw - 48px);
            height: 450px;
            max-height: calc(100vh - 48px);
            display: flex;
            flex-direction: column;
            background: var(--apple-card);
            color: var(--apple-card-foreground);
            border: 1px solid var(--apple-border);
            border-radius: var(--apple-radius-lg);
            box-shadow: var(--shadow-xl);
            overflow: hidden;
          }

          /* 标题栏 40px */
          .win-header {
            flex: 0 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px 0 14px;
            border-bottom: 1px solid var(--apple-border);
            background: var(--apple-background);
          }
          .win-title-group { display: flex; align-items: center; gap: 8px; }
          .win-title { font-size: 13px; font-weight: 600; color: var(--apple-foreground); }
          .win-subtitle { font-size: 10.5px; color: var(--apple-muted-foreground); }
          .win-sep { width: 1px; height: 14px; background: var(--apple-border); }

          .win-close {
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 999px;
            background: transparent;
            color: var(--apple-muted-foreground);
            cursor: pointer;
            transition: background-color 120ms cubic-bezier(.32,.72,0,1), color 120ms cubic-bezier(.32,.72,0,1);
          }
          .win-close:focus-visible { outline: 2px solid var(--apple-ring); outline-offset: 2px; }
          .win-close svg { width: 14px; height: 14px; }

          .win-body {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: 14px;
          }

          /* 文件选择行 */
          .file-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px;
            margin: -14px -14px 0;
            border-bottom: 1px solid var(--apple-border);
            background: var(--apple-background);
          }
          .file-select { position: relative; }
          .file-trigger {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 34px;
            padding: 0 12px;
            border: 1px solid var(--apple-border);
            border-radius: var(--apple-radius-md);
            background: var(--apple-background);
            color: var(--apple-foreground);
            font-size: 12px;
            box-shadow: var(--shadow-xs);
            cursor: pointer;
            transition: background-color 120ms cubic-bezier(.32,.72,0,1);
          }
          .file-trigger:focus-visible { outline: 2px solid var(--apple-ring); outline-offset: 2px; }
          .file-trigger svg { width: 13px; height: 13px; flex: none; }
          .file-trigger .icon-file { color: var(--apple-muted-foreground); }

          .copy-all-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 10px;
            border: 0;
            border-radius: 999px;
            background: transparent;
            color: var(--apple-primary);
            font-size: 11.5px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 120ms cubic-bezier(.32,.72,0,1);
          }
          .copy-all-btn:focus-visible { outline: 2px solid var(--apple-ring); outline-offset: 2px; }
          .copy-all-btn svg { width: 13px; height: 13px; }

          /* 文件名行 */
          .sheet-title-row { display: flex; align-items: baseline; gap: 10px; margin: 12px 2px; }
          .sheet-title { margin: 0; font-size: 13px; font-weight: 600; color: var(--apple-foreground); }
          .sheet-meta { font-size: 10.5px; color: var(--apple-muted-foreground); }

          /* 表格网格（卡片） */
          .sheet-table {
            flex: 1;
            min-height: 0;
            overflow: auto;
            background: var(--apple-card);
            border: 1px solid var(--apple-border);
            border-radius: var(--apple-radius-md);
            box-shadow: var(--shadow-sm);
          }
          table.sheet {
            width: 100%;
            min-width: 560px;
            border-collapse: collapse;
            font-size: 11px;
          }
          .sheet thead th {
            background: var(--apple-muted);
            color: var(--apple-muted-foreground);
            font-size: 11px;
            font-weight: 600;
            padding: 8px 10px;
            border-bottom: 1px solid var(--apple-border);
            text-align: left;
            white-space: nowrap;
          }
          .sheet tbody td {
            padding: 8px 10px;
            color: var(--apple-foreground);
            border-bottom: 1px solid var(--apple-border);
            transition: background-color 200ms cubic-bezier(.32,.72,0,1);
          }
          .sheet tbody tr:last-child td { border-bottom: 0; }
          .sheet-table tbody td.copied { background: var(--state-success-surface); }
          .sheet th.c-idx, .sheet td.c-idx { text-align: center; }
          .sheet th.c-num, .sheet td.c-num { text-align: right; font-family: var(--font-mono); }
          .sheet th.c-date, .sheet td.c-date { text-align: center; font-family: var(--font-mono); }
          .sheet tbody td:focus-visible { outline: 2px solid var(--apple-ring); outline-offset: -2px; }

          /* 状态栏 */
          .win-status {
            flex: 0 0 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--apple-muted);
            color: var(--apple-muted-foreground);
            font-size: 10.5px;
            border-top: 1px solid var(--apple-border);
            transition: color 200ms cubic-bezier(.32,.72,0,1);
          }
          .win-status.success { color: var(--state-success); }

          @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
              transition-duration: .01ms !important;
              animation-duration: .01ms !important;
            }
          }
        </style>

        <style id="page-styles">
          /* 文件下拉 popover（静态展示，隐藏） */
          .file-popover {
            display: none;
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            min-width: 220px;
            padding: 4px;
            background: var(--apple-popover);
            border: 1px solid var(--apple-border);
            border-radius: var(--apple-radius-md);
            box-shadow: var(--shadow-lg);
          }
          .file-option {
            display: block;
            width: 100%;
            padding: 8px 10px;
            border: 0;
            border-radius: var(--apple-radius-sm);
            background: transparent;
            color: var(--apple-foreground);
            font-size: 12px;
            text-align: left;
            cursor: pointer;
          }
          .file-option[aria-selected="true"] { color: var(--apple-primary); font-weight: 600; }
          /* ===== 桌面 hover：仅指针设备生效 ===== */
          @media (hover: hover) and (pointer: fine) {
            .win-close:hover { color: var(--apple-destructive); background: var(--apple-secondary); }
            .file-trigger:hover { background: var(--apple-muted); }
            .copy-all-btn:hover { background: var(--apple-secondary); }
            .file-option:hover { background: var(--apple-muted); }
            .sheet tbody tr:hover td { background: var(--apple-muted); transition-duration: 120ms; }
            .sheet-table tbody td:hover { background: var(--apple-accent); }
          }
          /* ===== 键盘可达性 ===== */
          button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--apple-ring); outline-offset: 2px; }
        </style>

        <div class="win-frame" id="win-frame">
          <header class="win-header">
            <div class="win-title-group">
              <span class="win-title">附件查看</span>
              <span class="win-sep" aria-hidden="true"></span>
              <span class="win-subtitle">2 个附件</span>
            </div>
            <button class="win-close" type="button" aria-label="关闭窗口" title="关闭窗口"><i data-lucide="x"></i></button>
          </header>

          <div class="win-body">
            <div class="file-row">
              <div class="file-select">
                <button class="file-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                  <i data-lucide="table-2" class="icon-file"></i>
                  <span>出货清单 0821.xlsx</span>
                  <i data-lucide="chevron-down"></i>
                </button>
                <div class="file-popover" role="listbox" aria-label="附件列表">
                  <button class="file-option" type="button" role="option" aria-selected="true">出货清单 0821.xlsx</button>
                  <button class="file-option" type="button" role="option">对账单 0718.xlsx</button>
                </div>
              </div>
              <button class="copy-all-btn" type="button"><i data-lucide="copy"></i><span>复制全文</span></button>
            </div>

            <div class="sheet-title-row">
              <h2 class="sheet-title">出货清单 0821.xlsx</h2>
              <span class="sheet-meta">Sheet1 · 24 行 × 8 列</span>
            </div>

            <div class="sheet-table">
              <table class="sheet" aria-label="出货清单数据">
                <colgroup>
                  <col style="width:40px">
                  <col>
                  <col>
                  <col>
                  <col style="width:60px">
                  <col style="width:56px">
                  <col style="width:64px">
                </colgroup>
                <thead>
                  <tr>
                    <th scope="col" class="c-idx">序号</th>
                    <th scope="col">客户名称</th>
                    <th scope="col">产品型号</th>
                    <th scope="col">规格</th>
                    <th scope="col" class="c-num">数量</th>
                    <th scope="col" class="c-date">交期</th>
                    <th scope="col">状态</th>
                  </tr>
                </thead>
                <tbody>
                  <tr><td class="c-idx" tabindex="0">1</td><td>王永强</td><td>XJ-8802</td><td>A-60</td><td class="c-num">500</td><td class="c-date">08-12</td><td>待发货</td></tr>
                  <tr><td class="c-idx" tabindex="0">2</td><td>王永强</td><td>XJ-9910</td><td>B-30</td><td class="c-num">320</td><td class="c-date">08-14</td><td>备料中</td></tr>
                  <tr><td class="c-idx" tabindex="0">3</td><td>林氏电子</td><td>LD-5521</td><td>C-12</td><td class="c-num">1200</td><td class="c-date">08-16</td><td>已排产</td></tr>
                  <tr><td class="c-idx" tabindex="0">4</td><td>宏远科技</td><td>HY-7733</td><td>A-90</td><td class="c-num">80</td><td class="c-date">08-19</td><td>待确认</td></tr>
                  <tr><td class="c-idx" tabindex="0">5</td><td>东泰精密</td><td>DT-3301</td><td>D-25</td><td class="c-num">640</td><td class="c-date">08-21</td><td>已发货</td></tr>
                  <tr><td class="c-idx" tabindex="0">6</td><td>华盛集团</td><td>HS-8800</td><td>B-55</td><td class="c-num">200</td><td class="c-date">08-25</td><td>备料中</td></tr>
                </tbody>
              </table>
            </div>
          </div>

          <footer class="win-status" id="win-status" aria-live="polite">
            <span class="status-text">点击单元格复制内容 · 快捷键 Ctrl+C</span>
          </footer>
        </div>

        <script>
          (function () {
            var status = document.getElementById('win-status');
            var statusText = status.querySelector('.status-text');
            var timer = null;
            function flash(label) {
              clearTimeout(timer);
              Array.prototype.forEach.call(document.querySelectorAll('td.copied'), function (c) {
                c.classList.remove('copied');
              });
              status.classList.add('success');
              statusText.textContent = '已复制：' + label;
              timer = setTimeout(function () {
                status.classList.remove('success');
                statusText.textContent = '点击单元格复制内容 · 快捷键 Ctrl+C';
                Array.prototype.forEach.call(document.querySelectorAll('td.copied'), function (c) {
                  c.classList.remove('copied');
                });
              }, 1600);
            }
            Array.prototype.forEach.call(document.querySelectorAll('.sheet tbody td'), function (cell) {
              cell.addEventListener('click', function () {
                cell.classList.add('copied');
                flash(cell.textContent.trim());
              });
              cell.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') {
                  e.preventDefault();
                  cell.classList.add('copied');
                  flash(cell.textContent.trim());
                }
              });
            });
            var copyAll = document.querySelector('.copy-all-btn');
            copyAll.addEventListener('click', function () {
              var n = document.querySelectorAll('.sheet tbody tr').length;
              var icon = copyAll.querySelector('i');
              icon.setAttribute('data-lucide', 'check');
              lucide.createIcons();
              flash('表格全文（' + n + ' 行）');
              setTimeout(function () {
                icon.setAttribute('data-lucide', 'copy');
                lucide.createIcons();
              }, 1600);
            });
          })();
        </script>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
