/*
 * Pinguo design tokens
 * Brand: Pinguo
 * Domain: Consumer imaging product
 * Style: Restrained, elegant, Apple-inspired
 * Theme mode: light-dark
 * Source language: zh
 * Output language: en
 *
 * Color architecture (two layers):
 *   1. Primitive palette - six categories. brand / background / text / icon
 *      are each a 10-step scale (50 lightest to 900 darkest). state-success and
 *      state-error are functional colors anchored on Apple system colors.
 *      Anchors follow Apple Human Interface Guidelines system colors
 *      (System Blue #007AFF, System Green #34C759, System Red #FF3B30,
 *      system grays / label / background colors).
 *   2. Semantic tokens - :root (light) and .dark map roles onto primitives.
 *      Components and UI kits must only consume the semantic tokens below.
 */

/* @group-priority: brand, background, text, icon, state-success, state-error */

:root {

  /* solo-design consumption aliases: explicit prefix for fill-html-head.mjs */
  --apple-background: var(--background, #ffffff);
  --apple-foreground: var(--foreground, #0f172a);
  --apple-card: var(--card, var(--background));
  --apple-card-foreground: var(--card-foreground, var(--foreground));
  --apple-popover: var(--popover, var(--card));
  --apple-popover-foreground: var(--popover-foreground, var(--card-foreground, var(--foreground)));
  --apple-primary: var(--primary, #111827);
  --apple-primary-foreground: var(--primary-foreground, #ffffff);
  --apple-secondary: var(--secondary, var(--muted, var(--card)));
  --apple-secondary-foreground: var(--secondary-foreground, var(--foreground));
  --apple-muted: var(--muted, var(--card));
  --apple-muted-foreground: var(--muted-foreground, var(--foreground));
  --apple-accent: var(--accent, var(--secondary, var(--muted, var(--card))));
  --apple-accent-foreground: var(--accent-foreground, var(--foreground));
  --apple-destructive: var(--destructive, #ef4444);
  --apple-destructive-foreground: var(--destructive-foreground, #ffffff);
  --apple-border: var(--border, currentColor);
  --apple-input: var(--input, var(--border));
  --apple-ring: var(--ring, var(--primary));
  --apple-chart-1: var(--chart-1, var(--primary));
  --apple-chart-2: var(--chart-2, var(--secondary, var(--primary)));
  --apple-chart-3: var(--chart-3, var(--accent, var(--primary)));
  --apple-chart-4: var(--chart-4, var(--muted-foreground, var(--foreground)));
  --apple-chart-5: var(--chart-5, var(--foreground));
  --apple-sidebar: var(--sidebar, var(--background));
  --apple-sidebar-foreground: var(--sidebar-foreground, var(--foreground));
  --apple-sidebar-primary: var(--sidebar-primary, var(--primary));
  --apple-sidebar-primary-foreground: var(--sidebar-primary-foreground, var(--primary-foreground));
  --apple-sidebar-accent: var(--sidebar-accent, var(--accent, var(--muted, var(--card))));
  --apple-sidebar-accent-foreground: var(--sidebar-accent-foreground, var(--accent-foreground, var(--foreground)));

/* ===== PRIMITIVE PALETTE ===== */

  /* brand */
  --brand-50: #e8f2ff;
  --brand-100: #cfe5ff;
  --brand-200: #9fcbff;
  --brand-300: #66abff;
  --brand-400: #2e8dff;
  --brand-500: #007aff; /* @primary */
  --brand-600: #0064d6;
  --brand-700: #004fad;
  --brand-800: #003b82;
  --brand-900: #00275a;

  /* background */
  --background-50: #ffffff;
  --background-100: #f7f7fa;
  --background-200: #f2f2f7;
  --background-300: #e5e5ea;
  --background-400: #d1d1d6;
  --background-500: #aeaeb2;
  --background-600: #8e8e93;
  --background-700: #3a3a3c;
  --background-800: #1c1c1e;
  --background-900: #000000;

  /* text */
  --text-50: #f5f5f7;
  --text-100: #e3e3e8;
  --text-200: #c7c7cc;
  --text-300: #aeaeb2;
  --text-400: #8e8e93;
  --text-500: #6e6e73;
  --text-600: #48484a;
  --text-700: #3c3c43;
  --text-800: #1d1d1f;
  --text-900: #000000;

  /* icon */
  --icon-50: #f5f5f7;
  --icon-100: #e5e5ea;
  --icon-200: #d1d1d6;
  --icon-300: #c7c7cc;
  --icon-400: #aeaeb2;
  --icon-500: #8e8e93;
  --icon-600: #6e6e73;
  --icon-700: #48484a;
  --icon-800: #2c2c2e;
  --icon-900: #1d1d1f;

  /* state-success */
  --state-success: #34c759; /* @primary */
  --state-success-dark: #30d158;
  --state-success-surface: #e9f9ee;
  --state-success-foreground: #ffffff;

  /* state-error */
  --state-error: #ff3b30; /* @primary */
  --state-error-dark: #ff453a;
  --state-error-surface: #ffecea;
  --state-error-foreground: #ffffff;

  /* ===== SEMANTIC ROLES ===== */

  /* semantic */
  --background: var(--background-50);
  --foreground: var(--text-800);
  --card: var(--background-50);
  --card-foreground: var(--text-800);
  --popover: var(--background-50);
  --popover-foreground: var(--text-900);

  --primary: var(--brand-500);
  --primary-foreground: var(--background-50);
  --secondary: var(--background-200);
  --secondary-foreground: var(--text-800);
  --muted: var(--background-200);
  --muted-foreground: var(--text-400);
  --accent: var(--background-100);
  --accent-foreground: var(--text-800);
  --destructive: var(--state-error);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-300);
  --input: var(--background-400);
  --ring: var(--brand-500);

  --icon: var(--icon-900);
  --icon-muted: var(--icon-500);

  /* chart */
  --chart-1: var(--state-success);
  --chart-2: var(--brand-500);
  --chart-3: #ff9500;
  --chart-4: #5856d6;
  --chart-5: #af52de;

  /* sidebar */
  --sidebar: var(--background-200);
  --sidebar-foreground: var(--text-800);
  --sidebar-primary: var(--brand-500);
  --sidebar-primary-foreground: var(--background-50);
  --sidebar-accent: var(--background-300);
  --sidebar-accent-foreground: var(--text-800);
  --sidebar-border: var(--background-300);
  --sidebar-ring: var(--brand-500);

  /* TYPOGRAPHY */
  --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;
  --tracking-normal: 0em;

  /* RADIUS */
  --radius: 1.2rem;

  /* SHADOWS */
  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.04); /* Hairline */
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04); /* Subtle */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05), 0 1px 3px -1px rgba(0, 0, 0, 0.05); /* Card */
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.05); /* Raised */
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.05); /* Card Hover */
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.08), 0 4px 8px -4px rgba(0, 0, 0, 0.05); /* Float */
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.10), 0 8px 16px -8px rgba(0, 0, 0, 0.06); /* Overlay */
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.12); /* Modal */

  /* SPACING */
  --spacing: 0.24rem;
}

/* ===== SEMANTIC ROLES - dark (primitive palette inherited) ===== */
.dark {
  --background: var(--background-900);
  --foreground: var(--text-50);
  --card: var(--background-800);
  --card-foreground: var(--text-50);
  --popover: var(--background-700);
  --popover-foreground: var(--text-50);

  --primary: var(--brand-400);
  --primary-foreground: var(--background-900);
  --secondary: var(--background-800);
  --secondary-foreground: var(--text-50);
  --muted: var(--background-800);
  --muted-foreground: var(--text-400);
  --accent: var(--background-700);
  --accent-foreground: var(--text-50);
  --destructive: var(--state-error-dark);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success-dark);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-700);
  --input: var(--background-700);
  --ring: var(--brand-400);

  --icon: var(--icon-50);
  --icon-muted: var(--icon-500);

  --chart-1: var(--state-success-dark);
  --chart-2: var(--brand-400);
  --chart-3: #ff9f0a;
  --chart-4: #5e5ce6;
  --chart-5: #bf5af2;

  --sidebar: var(--background-800);
  --sidebar-foreground: var(--text-50);
  --sidebar-primary: var(--brand-400);
  --sidebar-primary-foreground: var(--background-900);
  --sidebar-accent: var(--background-700);
  --sidebar-accent-foreground: var(--text-50);
  --sidebar-border: var(--background-700);
  --sidebar-ring: var(--brand-400);

  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.30);
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.30);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.36), 0 1px 3px -1px rgba(0, 0, 0, 0.36);
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.40), 0 1px 2px -1px rgba(0, 0, 0, 0.36);
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.44), 0 2px 4px -2px rgba(0, 0, 0, 0.36);
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.50), 0 4px 8px -4px rgba(0, 0, 0, 0.40);
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.55), 0 8px 16px -8px rgba(0, 0, 0, 0.44);
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.60);
}

/* radius semantic bridge - derived from Library --radius (1.2rem = 19.2px) */:root {
  --apple-radius-sm: calc(var(--radius) * 0.42);
  --apple-radius-md: calc(var(--radius) * 0.75);
  --apple-radius-lg: var(--radius);
}

      /* ===== Static shell — no Tailwind runtime dependency ===== */
      * , *::before , *::after { box-sizing: border-box; }
      html , body { max-width: 100%; overflow-x: hidden; }
      body { min-height: 100vh; background: var(--apple-background); color: var(--apple-foreground); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }

      /* ===== 320x720 app shell ===== */
      .app-frame { width: 400px; min-height: 640px; margin-inline: auto; background: var(--apple-background); display: flex; flex-direction: column; position: relative; }
      .underlay { flex: 1; display: flex; flex-direction: column; min-height: 0; filter: blur(2px) saturate(.85); opacity: .55; pointer-events: none; transition: filter .25s cubic-bezier(.32,.72,0,1), opacity .25s cubic-bezier(.32,.72,0,1); }
      .app-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px 10px; }
      .app-heading { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .app-title { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.2; color: var(--apple-foreground); }
      .app-subtitle { margin: 0; font-size: 11px; line-height: 1.4; color: var(--apple-muted-foreground); }
      .app-content { flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 0 16px; }
      .note-list { display: flex; flex-direction: column; gap: 8px; }
      .note-card { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; background: var(--apple-card); border: 1px solid var(--apple-border); border-radius: var(--apple-radius-md); box-shadow: var(--shadow-xs); }
      .note-head { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; min-width: 0; }
      .note-title { margin: 0; font-size: 13px; font-weight: 600; line-height: 1.4; color: var(--apple-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .note-tag { flex: none; justify-self: end; font-size: 10px; line-height: 1; color: var(--apple-muted-foreground); background: var(--apple-muted); border-radius: 999px; padding: 6px 8px; }
      .note-preview { margin: 0; font-size: 12px; line-height: 1.5; color: var(--apple-muted-foreground); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

      /* ===== Editor overlay ===== */
      .editor-overlay { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; padding: 12px; background: color-mix(in srgb, var(--apple-foreground) 42%, transparent); backdrop-filter: blur(2px); animation: overlay-fade .22s cubic-bezier(.32,.72,0,1); }
      .editor-panel { width: min(100%, 400px); max-height: calc(100vh - 24px); overflow-y: auto; overscroll-behavior: contain; background: var(--apple-card); border: 1px solid var(--apple-border); border-radius: var(--apple-radius-lg); box-shadow: var(--shadow-xl); display: flex; flex-direction: column; animation: panel-rise .28s cubic-bezier(.32,.72,0,1); }

      .editor-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px 10px; flex: none; }
      .editor-header h2 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.2; color: var(--apple-foreground); }

      .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border: 0; border-radius: 999px; background: transparent; color: var(--apple-muted-foreground); cursor: pointer; transition: background-color .15s cubic-bezier(.32,.72,0,1), color .15s cubic-bezier(.32,.72,0,1), transform .15s cubic-bezier(.32,.72,0,1); }
      .icon-btn:active { transform: scale(.95); }
      .icon-btn:focus-visible { outline: 2px solid var(--apple-ring); outline-offset: 1px; }
      .icon-btn svg { width: 18px; height: 18px; }

      .panel-body { display: flex; flex-direction: column; gap: 10px; padding: 4px 16px 14px; min-width: 0; }

      .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
      .field > span { font-size: 12px; font-weight: 500; line-height: 1.3; color: var(--apple-muted-foreground); }
      .field input[type="text"] , .field input[type="date"] , .field input[type="time"] , .field select {
        width: 100%; height: 36px; padding: 0 10px; border: 1px solid var(--apple-border); border-radius: 10px;
        background: var(--apple-background); color: var(--apple-foreground); font-size: 13px; font-family: inherit;
        outline: none; min-width: 0; transition: border-color .15s cubic-bezier(.32,.72,0,1), box-shadow .15s cubic-bezier(.32,.72,0,1);
      }
      .field input::placeholder { color: var(--apple-muted-foreground); }
      .field input:focus , .field select:focus { border-color: var(--apple-ring); box-shadow: 0 0 0 3px color-mix(in srgb, var(--apple-ring) 18%, transparent); }
      .field-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
      .full { grid-column: 1 / -1; }

      .color-picker-row { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; min-height: 36px; padding: 0 2px; }
      .color-picker-dot { width: 20px; height: 20px; border-radius: 999px; border: 1px solid transparent; padding: 0; cursor: pointer; flex: none; transition: transform .15s cubic-bezier(.32,.72,0,1), box-shadow .15s cubic-bezier(.32,.72,0,1); }
      .color-picker-dot:focus-visible { outline: 2px solid var(--apple-ring); outline-offset: 1px; }
      .color-picker-dot.active { box-shadow: 0 0 0 2px var(--apple-background), 0 0 0 4px var(--apple-ring); }
      .color-picker-dot.dot-default { background: var(--apple-input); }
      .color-picker-dot.dot-red { background: var(--apple-destructive); }
      .color-picker-dot.dot-orange { background: var(--apple-chart-3); }
      .color-picker-dot.dot-yellow { background: var(--note-yellow); }
      .color-picker-dot.dot-green { background: var(--apple-chart-1); }
      .color-picker-dot.dot-blue { background: var(--apple-chart-2); }
      .color-picker-dot.dot-purple { background: var(--apple-chart-5); }

      .remind-toggle { display: flex; align-items: center; gap: 8px; padding: 2px; cursor: pointer; user-select: none; font-size: 13px; line-height: 1.3; color: var(--apple-foreground); }
      .remind-toggle input { width: 16px; height: 16px; margin: 0; accent-color: var(--apple-primary); cursor: pointer; }
      .remind-toggle .remind-icon { width: 16px; height: 16px; color: var(--apple-primary); }

      .md-editor-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
      .md-textarea { width: 100%; height: 170px; padding: 10px 12px; border: 1px solid var(--apple-border); border-radius: 10px; background: var(--apple-background); color: var(--apple-foreground); font-size: 13px; line-height: 1.55; font-family: var(--font-sans); resize: vertical; outline: none; min-width: 0; transition: border-color .15s cubic-bezier(.32,.72,0,1), box-shadow .15s cubic-bezier(.32,.72,0,1); }
      .md-textarea::placeholder { color: var(--apple-muted-foreground); }
      .md-textarea:focus { border-color: var(--apple-ring); box-shadow: 0 0 0 3px color-mix(in srgb, var(--apple-ring) 18%, transparent); }
      .md-preview { height: 170px; overflow-y: auto; padding: 10px 12px; border: 1px solid var(--apple-border); border-radius: 10px; background: var(--apple-muted); color: var(--apple-foreground); font-size: 12px; line-height: 1.6; }
      .md-preview p { margin: 0 0 6px; }
      .md-preview .pv-strong { font-weight: 600; }
      .md-preview ul { margin: 0 0 6px; padding-left: 1.2em; }
      .md-preview li { margin: 2px 0; }
      .md-preview blockquote { margin: 6px 0 0; padding-left: 8px; border-left: 3px solid var(--apple-ring); color: var(--apple-muted-foreground); }

      .attachments { display: flex; flex-direction: column; gap: 8px; }
      .attachment-list { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
      .attachment-chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; height: 28px; padding: 0 8px 0 10px; border: 1px solid var(--apple-border); border-radius: 999px; background: var(--apple-background); color: var(--apple-foreground); font-size: 12px; cursor: pointer; transition: border-color .15s cubic-bezier(.32,.72,0,1), background-color .15s cubic-bezier(.32,.72,0,1); }
      .attachment-chip:focus-visible { outline: 2px solid var(--apple-ring); outline-offset: 1px; }
      .attachment-chip .chip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .attachment-chip .chip-x { width: 12px; height: 12px; flex: none; color: var(--apple-muted-foreground); }

      .editor-actions { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; padding: 12px 16px 14px; border-top: 1px solid var(--apple-border); background: var(--apple-muted); border-radius: 0 0 var(--apple-radius-lg) var(--apple-radius-lg); flex: none; }

      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 16px; border-radius: 999px; font-size: 13px; font-weight: 500; line-height: 1; cursor: pointer; transition: filter .15s cubic-bezier(.32,.72,0,1), transform .15s cubic-bezier(.32,.72,0,1), background-color .15s cubic-bezier(.32,.72,0,1), border-color .15s cubic-bezier(.32,.72,0,1); }
      .btn:active { transform: scale(.97); }
      .btn:focus-visible { outline: 2px solid var(--apple-ring); outline-offset: 2px; }
      .btn svg { width: 15px; height: 15px; }
      .btn-primary { background: var(--apple-primary); border: 1px solid transparent; color: var(--apple-primary-foreground); font-weight: 600; padding: 0 22px; }
      .btn-secondary { background: var(--apple-background); border: 1px solid var(--apple-border); color: var(--apple-foreground); }
      .btn-danger { background: color-mix(in srgb, var(--apple-destructive) 8%, transparent); border: 1px solid color-mix(in srgb, var(--apple-destructive) 28%, transparent); color: var(--apple-destructive); }

      @keyframes overlay-fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes panel-rise { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }
      @media (max-width: 340px) {
        .md-editor-row { grid-template-columns: minmax(0, 1fr); }
        .md-textarea , .md-preview { height: 132px; }
      }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; } }
    </style>
    <style id="page-styles">

      @media (hover: hover) and (pointer: fine) {

      /* ===== 键盘可达性 ===== */
