/*
 * Pinguo design tokens
 * Brand: Pinguo
 * Domain: Consumer imaging product
 * Style: Restrained, elegant, Apple-inspired
 * Theme mode: light-dark
 * Source language: zh
 * Output language: en
 *
 * Color architecture (two layers):
 *   1. Primitive palette - six categories. brand / background / text / icon
 *      are each a 10-step scale (50 lightest to 900 darkest). state-success and
 *      state-error are functional colors anchored on Apple system colors.
 *      Anchors follow Apple Human Interface Guidelines system colors
 *      (System Blue #007AFF, System Green #34C759, System Red #FF3B30,
 *      system grays / label / background colors).
 *   2. Semantic tokens - :root (light) and .dark map roles onto primitives.
 *      Components and UI kits must only consume the semantic tokens below.
 */

/* @group-priority: brand, background, text, icon, state-success, state-error */

:root {
  
  /* solo-design consumption aliases: explicit prefix for fill-html-head.mjs */
  --apple-background: var(--background, #ffffff);
  --apple-foreground: var(--foreground, #0f172a);
  --apple-card: var(--card, var(--background));
  --apple-card-foreground: var(--card-foreground, var(--foreground));
  --apple-popover: var(--popover, var(--card));
  --apple-popover-foreground: var(--popover-foreground, var(--card-foreground, var(--foreground)));
  --apple-primary: var(--primary, #111827);
  --apple-primary-foreground: var(--primary-foreground, #ffffff);
  --apple-secondary: var(--secondary, var(--muted, var(--card)));
  --apple-secondary-foreground: var(--secondary-foreground, var(--foreground));
  --apple-muted: var(--muted, var(--card));
  --apple-muted-foreground: var(--muted-foreground, var(--foreground));
  --apple-accent: var(--accent, var(--secondary, var(--muted, var(--card))));
  --apple-accent-foreground: var(--accent-foreground, var(--foreground));
  --apple-destructive: var(--destructive, #ef4444);
  --apple-destructive-foreground: var(--destructive-foreground, #ffffff);
  --apple-border: var(--border, currentColor);
  --apple-input: var(--input, var(--border));
  --apple-ring: var(--ring, var(--primary));
  --apple-chart-1: var(--chart-1, var(--primary));
  --apple-chart-2: var(--chart-2, var(--secondary, var(--primary)));
  --apple-chart-3: var(--chart-3, var(--accent, var(--primary)));
  --apple-chart-4: var(--chart-4, var(--muted-foreground, var(--foreground)));
  --apple-chart-5: var(--chart-5, var(--foreground));
  --apple-sidebar: var(--sidebar, var(--background));
  --apple-sidebar-foreground: var(--sidebar-foreground, var(--foreground));
  --apple-sidebar-primary: var(--sidebar-primary, var(--primary));
  --apple-sidebar-primary-foreground: var(--sidebar-primary-foreground, var(--primary-foreground));
  --apple-sidebar-accent: var(--sidebar-accent, var(--accent, var(--muted, var(--card))));
  --apple-sidebar-accent-foreground: var(--sidebar-accent-foreground, var(--accent-foreground, var(--foreground)));

/* ===== PRIMITIVE PALETTE ===== */

  /* brand */
  --brand-50: #e8f2ff;
  --brand-100: #cfe5ff;
  --brand-200: #9fcbff;
  --brand-300: #66abff;
  --brand-400: #2e8dff;
  --brand-500: #007aff; /* @primary */
  --brand-600: #0064d6;
  --brand-700: #004fad;
  --brand-800: #003b82;
  --brand-900: #00275a;

  /* background */
  --background-50: #ffffff;
  --background-100: #f7f7fa;
  --background-200: #f2f2f7;
  --background-300: #e5e5ea;
  --background-400: #d1d1d6;
  --background-500: #aeaeb2;
  --background-600: #8e8e93;
  --background-700: #3a3a3c;
  --background-800: #1c1c1e;
  --background-900: #000000;

  /* text */
  --text-50: #f5f5f7;
  --text-100: #e3e3e8;
  --text-200: #c7c7cc;
  --text-300: #aeaeb2;
  --text-400: #8e8e93;
  --text-500: #6e6e73;
  --text-600: #48484a;
  --text-700: #3c3c43;
  --text-800: #1d1d1f;
  --text-900: #000000;

  /* icon */
  --icon-50: #f5f5f7;
  --icon-100: #e5e5ea;
  --icon-200: #d1d1d6;
  --icon-300: #c7c7cc;
  --icon-400: #aeaeb2;
  --icon-500: #8e8e93;
  --icon-600: #6e6e73;
  --icon-700: #48484a;
  --icon-800: #2c2c2e;
  --icon-900: #1d1d1f;

  /* state-success */
  --state-success: #34c759; /* @primary */
  --state-success-dark: #30d158;
  --state-success-surface: #e9f9ee;
  --state-success-foreground: #ffffff;

  /* state-error */
  --state-error: #ff3b30; /* @primary */
  --state-error-dark: #ff453a;
  --state-error-surface: #ffecea;
  --state-error-foreground: #ffffff;

  /* ===== SEMANTIC ROLES ===== */

  /* semantic */
  --background: var(--background-50);
  --foreground: var(--text-800);
  --card: var(--background-50);
  --card-foreground: var(--text-800);
  --popover: var(--background-50);
  --popover-foreground: var(--text-900);

  --primary: var(--brand-500);
  --primary-foreground: var(--background-50);
  --secondary: var(--background-200);
  --secondary-foreground: var(--text-800);
  --muted: var(--background-200);
  --muted-foreground: var(--text-400);
  --accent: var(--background-100);
  --accent-foreground: var(--text-800);
  --destructive: var(--state-error);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-300);
  --input: var(--background-400);
  --ring: var(--brand-500);

  --icon: var(--icon-900);
  --icon-muted: var(--icon-500);

  /* chart */
  --chart-1: var(--state-success);
  --chart-2: var(--brand-500);
  --chart-3: #ff9500;
  --chart-4: #5856d6;
  --chart-5: #af52de;

  /* sidebar */
  --sidebar: var(--background-200);
  --sidebar-foreground: var(--text-800);
  --sidebar-primary: var(--brand-500);
  --sidebar-primary-foreground: var(--background-50);
  --sidebar-accent: var(--background-300);
  --sidebar-accent-foreground: var(--text-800);
  --sidebar-border: var(--background-300);
  --sidebar-ring: var(--brand-500);

  /* TYPOGRAPHY */
  --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;
  --tracking-normal: 0em;

  /* RADIUS */
  --radius: 1.2rem;

  /* SHADOWS */
  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.04); /* Hairline */
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04); /* Subtle */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05), 0 1px 3px -1px rgba(0, 0, 0, 0.05); /* Card */
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.05); /* Raised */
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.05); /* Card Hover */
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.08), 0 4px 8px -4px rgba(0, 0, 0, 0.05); /* Float */
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.10), 0 8px 16px -8px rgba(0, 0, 0, 0.06); /* Overlay */
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.12); /* Modal */

  /* SPACING */
  --spacing: 0.24rem;
}

/* ===== SEMANTIC ROLES - dark (primitive palette inherited) ===== */
.dark {
  --background: var(--background-900);
  --foreground: var(--text-50);
  --card: var(--background-800);
  --card-foreground: var(--text-50);
  --popover: var(--background-700);
  --popover-foreground: var(--text-50);

  --primary: var(--brand-400);
  --primary-foreground: var(--background-900);
  --secondary: var(--background-800);
  --secondary-foreground: var(--text-50);
  --muted: var(--background-800);
  --muted-foreground: var(--text-400);
  --accent: var(--background-700);
  --accent-foreground: var(--text-50);
  --destructive: var(--state-error-dark);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success-dark);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-700);
  --input: var(--background-700);
  --ring: var(--brand-400);

  --icon: var(--icon-50);
  --icon-muted: var(--icon-500);

  --chart-1: var(--state-success-dark);
  --chart-2: var(--brand-400);
  --chart-3: #ff9f0a;
  --chart-4: #5e5ce6;
  --chart-5: #bf5af2;

  --sidebar: var(--background-800);
  --sidebar-foreground: var(--text-50);
  --sidebar-primary: var(--brand-400);
  --sidebar-primary-foreground: var(--background-900);
  --sidebar-accent: var(--background-700);
  --sidebar-accent-foreground: var(--text-50);
  --sidebar-border: var(--background-700);
  --sidebar-ring: var(--brand-400);

  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.30);
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.30);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.36), 0 1px 3px -1px rgba(0, 0, 0, 0.36);
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.40), 0 1px 2px -1px rgba(0, 0, 0, 0.36);
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.44), 0 2px 4px -2px rgba(0, 0, 0, 0.36);
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.50), 0 4px 8px -4px rgba(0, 0, 0, 0.40);
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.55), 0 8px 16px -8px rgba(0, 0, 0, 0.44);
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.60);
}

/* radius semantic bridge - derived from Library --radius (1.2rem = 19.2px) */:root {
  --apple-radius-sm: calc(var(--radius) * 0.42);
  --apple-radius-md: calc(var(--radius) * 0.75);
  --apple-radius-lg: var(--radius);
}

      /* ===== 快捷键设置子窗口：壳层、页头、分组、卡片（无 Tailwind 运行时依赖） ===== */
      body{margin:0;background:var(--apple-muted);font-family:var(--font-sans);color:var(--apple-foreground);-webkit-font-smoothing:antialiased}
      .app-shell{width:400px;min-height:640px;margin-inline:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 0;box-sizing:border-box}
      .shortcut-window{width:320px;max-height:420px;display:flex;flex-direction:column;background:var(--apple-card);border:1px solid var(--apple-border);border-radius:16px;box-shadow:var(--shadow-xl);overflow:hidden}
      .window-header{display:flex;align-items:center;gap:4px;height:46px;padding:0 8px;flex:none;border-bottom:1px solid var(--apple-border)}
      .win-icon-btn{width:30px;height:30px;padding:0;border:0;border-radius:999px;background:transparent;color:var(--apple-muted-foreground);display:flex;align-items:center;justify-content:center;cursor:pointer}
      .win-icon-btn svg{width:16px;height:16px}
      .win-title{flex:1;min-width:0;margin:0;text-align:center;font-size:13px;font-weight:600;color:var(--apple-foreground)}
      .shortcut-scroll{flex:1;min-height:0;overflow-y:auto;padding:2px 16px 10px}
      .shortcut-group{margin-bottom:4px}
      .shortcut-group-title{margin:0;padding:10px 2px 6px;font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--apple-muted-foreground)}
      .shortcut-card{display:block;padding:9px 10px;margin-bottom:6px;background:var(--apple-card);border:1px solid var(--apple-border);border-radius:12px;box-shadow:var(--shadow-xs)}
      .shortcut-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
      .shortcut-name{margin:0;font-size:12px;font-weight:600;color:var(--apple-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .shortcut-scope{flex:none;font-size:9px;line-height:1;padding:3px 7px;border-radius:999px;background:color-mix(in srgb,var(--apple-primary) 12%,transparent);color:var(--apple-primary)}
      .shortcut-scope.window{background:var(--apple-muted);color:var(--apple-muted-foreground)}
      .shortcut-desc{margin:2px 0 0;font-size:10px;line-height:1.4;color:var(--apple-muted-foreground);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
      .shortcut-card-actions{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap}
      .shortcut-chip{flex:1;min-width:0;padding:5px 10px;font-size:11px;line-height:1;font-family:var(--font-mono);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:999px;border:1px solid transparent;background:color-mix(in srgb,var(--apple-primary) 10%,transparent);color:var(--apple-foreground)}
      .shortcut-chip.recording{font-family:var(--font-sans);color:var(--apple-primary);background:color-mix(in srgb,var(--apple-primary) 10%,transparent);border-color:var(--apple-primary);animation:sc-pulse 1s ease-in-out infinite}
      .shortcut-chip.captured{background:var(--apple-primary);border-color:var(--apple-primary);color:var(--apple-primary-foreground)}
      .sc-btn{flex:none;padding:5px 10px;font-size:10px;line-height:1;font-family:inherit;color:var(--apple-foreground);background:var(--apple-card);border:1px solid var(--apple-border);border-radius:999px;cursor:pointer}
      .sc-btn.primary{background:var(--apple-primary);border-color:var(--apple-primary);color:var(--apple-primary-foreground)}
      .shortcut-conflict{display:flex;align-items:center;gap:4px;margin-top:6px;font-size:10px;line-height:1.35;color:var(--apple-chart-3)}
      .shortcut-conflict svg{width:11px;height:11px;flex:none}
      .shortcut-footer{flex:none;display:flex;justify-content:flex-end;gap:8px;padding:9px 12px;border-top:1px solid var(--apple-border)}
      .se-reset-btn{padding:6px 13px;font-size:11px;line-height:1;font-family:inherit;color:var(--apple-muted-foreground);background:var(--apple-card);border:1px solid var(--apple-border);border-radius:999px;cursor:pointer}
      .no-scrollbar::-webkit-scrollbar{display:none}
      .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
    </style>
    <style id="page-styles">
      /* ===== 交互增强与动效（运行时仅做增强） ===== */
      .shortcut-card{transition:border-color .15s cubic-bezier(.32,.72,0,1),box-shadow .15s cubic-bezier(.32,.72,0,1)}
      .win-icon-btn,.sc-btn,.se-reset-btn{transition:background-color .15s,color .15s,border-color .15s,transform .15s}
      .win-icon-btn:active,.sc-btn:active,.se-reset-btn:active{transform:scale(.96)}
      .win-icon-btn:focus-visible,.sc-btn:focus-visible,.se-reset-btn:focus-visible{outline:2px solid var(--apple-ring);outline-offset:2px}
      @keyframes sc-pulse{0%,100%{border-color:var(--apple-primary)}50%{border-color:transparent}}
      /* ===== 桌面 hover（仅精确指针设备） ===== */
      @media (hover: hover) and (pointer: fine){
        .shortcut-card:hover{border-color:var(--apple-ring);box-shadow:var(--shadow-sm)}
        .shortcut-card:hover .shortcut-chip:not(.recording):not(.captured){border-color:var(--apple-ring);color:var(--apple-primary)}
        .win-icon-btn:hover{background:var(--apple-secondary);color:var(--apple-foreground)}
        .sc-btn:hover{border-color:var(--apple-ring);color:var(--apple-primary)}
        .sc-btn.primary:hover{filter:brightness(.92)}
        .se-reset-btn:hover{border-color:var(--apple-ring);color:var(--apple-primary)}
      }
      @media (prefers-reduced-motion: reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
    </style>
    <div class="app-shell" id="app-shell">
      <section class="shortcut-window" aria-label="快捷键设置窗口">
        <header class="window-header">
          <button class="win-icon-btn" type="button" aria-label="返回设置" title="返回设置"><i data-lucide="arrow-left" aria-hidden="true"></i></button>
          <h1 class="win-title">快捷键设置</h1>
          <button class="win-icon-btn" type="button" aria-label="关闭" title="关闭"><i data-lucide="x" aria-hidden="true"></i></button>
        </header>
        <div class="shortcut-scroll no-scrollbar">
          <section class="shortcut-group" aria-label="全局快捷键">
            <h2 class="shortcut-group-title">全局</h2>
            <article class="shortcut-card">
              <div class="shortcut-card-head">
                <span class="shortcut-name">显示/隐藏窗口</span>
                <span class="shortcut-scope">全局</span>
              </div>
              <p class="shortcut-desc">显示或隐藏主窗口</p>
              <div class="shortcut-card-actions">
                <span class="shortcut-chip">F3</span>
                <button class="sc-btn" type="button">编辑</button>
                <button class="sc-btn" type="button">清除</button>
              </div>
            </article>
            <article class="shortcut-card">
              <div class="shortcut-card-head">
                <span class="shortcut-name">切换鼠标穿透</span>
                <span class="shortcut-scope">全局</span>
              </div>
              <p class="shortcut-desc">切换穿透模式，开启后点击穿透窗口</p>
              <div class="shortcut-card-actions">
                <span class="shortcut-chip recording">按下组合键…</span>
                <button class="sc-btn" type="button">取消</button>
              </div>
            </article>
          </section>
          <section class="shortcut-group" aria-label="窗口快捷键">
            <h2 class="shortcut-group-title">窗口</h2>
            <article class="shortcut-card">
              <div class="shortcut-card-head">
                <span class="shortcut-name">快捷新建</span>
                <span class="shortcut-scope window">窗口</span>
              </div>
              <p class="shortcut-desc">在主窗口中新建一条记录</p>
              <div class="shortcut-card-actions">
                <span class="shortcut-chip captured">Ctrl+Shift+P</span>
                <button class="sc-btn primary" type="button">保存</button>
                <button class="sc-btn" type="button">取消</button>
              </div>
              <div class="shortcut-conflict">
                <i data-lucide="alert-triangle" aria-hidden="true"></i>
                <span>与「切换鼠标穿透」冲突，保存将覆盖</span>
              </div>
            </article>
            <article class="shortcut-card">
              <div class="shortcut-card-head">
                <span class="shortcut-name">打开设置</span>
                <span class="shortcut-scope window">窗口</span>
              </div>
              <p class="shortcut-desc">快速打开设置窗口（默认 Ctrl+,）</p>
              <div class="shortcut-card-actions">
                <span class="shortcut-chip">Ctrl+Alt+,</span>
                <button class="sc-btn" type="button">编辑</button>
                <button class="sc-btn" type="button">清除</button>
                <button class="sc-btn" type="button">默认</button>
              </div>
            </article>
          </section>
        </div>
        <footer class="shortcut-footer">
          <button class="se-reset-btn" type="button">恢复全部默认</button>
        </footer>
      </section>
    </div>
  </main>
    <script>lucide.createIcons();</script>
</body>
</html>
