/*
 * Pinguo design tokens
 * Brand: Pinguo
 * Domain: Consumer imaging product
 * Style: Restrained, elegant, Apple-inspired
 * Theme mode: light-dark
 * Source language: zh
 * Output language: en
 *
 * Color architecture (two layers):
 *   1. Primitive palette - six categories. brand / background / text / icon
 *      are each a 10-step scale (50 lightest to 900 darkest). state-success and
 *      state-error are functional colors anchored on Apple system colors.
 *      Anchors follow Apple Human Interface Guidelines system colors
 *      (System Blue #007AFF, System Green #34C759, System Red #FF3B30,
 *      system grays / label / background colors).
 *   2. Semantic tokens - :root (light) and .dark map roles onto primitives.
 *      Components and UI kits must only consume the semantic tokens below.
 */

/* @group-priority: brand, background, text, icon, state-success, state-error */

:root {
  
  /* solo-design consumption aliases: explicit prefix for fill-html-head.mjs */
  --apple-background: var(--background, #ffffff);
  --apple-foreground: var(--foreground, #0f172a);
  --apple-card: var(--card, var(--background));
  --apple-card-foreground: var(--card-foreground, var(--foreground));
  --apple-popover: var(--popover, var(--card));
  --apple-popover-foreground: var(--popover-foreground, var(--card-foreground, var(--foreground)));
  --apple-primary: var(--primary, #111827);
  --apple-primary-foreground: var(--primary-foreground, #ffffff);
  --apple-secondary: var(--secondary, var(--muted, var(--card)));
  --apple-secondary-foreground: var(--secondary-foreground, var(--foreground));
  --apple-muted: var(--muted, var(--card));
  --apple-muted-foreground: var(--muted-foreground, var(--foreground));
  --apple-accent: var(--accent, var(--secondary, var(--muted, var(--card))));
  --apple-accent-foreground: var(--accent-foreground, var(--foreground));
  --apple-destructive: var(--destructive, #ef4444);
  --apple-destructive-foreground: var(--destructive-foreground, #ffffff);
  --apple-border: var(--border, currentColor);
  --apple-input: var(--input, var(--border));
  --apple-ring: var(--ring, var(--primary));
  --apple-chart-1: var(--chart-1, var(--primary));
  --apple-chart-2: var(--chart-2, var(--secondary, var(--primary)));
  --apple-chart-3: var(--chart-3, var(--accent, var(--primary)));
  --apple-chart-4: var(--chart-4, var(--muted-foreground, var(--foreground)));
  --apple-chart-5: var(--chart-5, var(--foreground));
  --apple-sidebar: var(--sidebar, var(--background));
  --apple-sidebar-foreground: var(--sidebar-foreground, var(--foreground));
  --apple-sidebar-primary: var(--sidebar-primary, var(--primary));
  --apple-sidebar-primary-foreground: var(--sidebar-primary-foreground, var(--primary-foreground));
  --apple-sidebar-accent: var(--sidebar-accent, var(--accent, var(--muted, var(--card))));
  --apple-sidebar-accent-foreground: var(--sidebar-accent-foreground, var(--accent-foreground, var(--foreground)));

/* ===== PRIMITIVE PALETTE ===== */

  /* brand */
  --brand-50: #e8f2ff;
  --brand-100: #cfe5ff;
  --brand-200: #9fcbff;
  --brand-300: #66abff;
  --brand-400: #2e8dff;
  --brand-500: #007aff; /* @primary */
  --brand-600: #0064d6;
  --brand-700: #004fad;
  --brand-800: #003b82;
  --brand-900: #00275a;

  /* background */
  --background-50: #ffffff;
  --background-100: #f7f7fa;
  --background-200: #f2f2f7;
  --background-300: #e5e5ea;
  --background-400: #d1d1d6;
  --background-500: #aeaeb2;
  --background-600: #8e8e93;
  --background-700: #3a3a3c;
  --background-800: #1c1c1e;
  --background-900: #000000;

  /* text */
  --text-50: #f5f5f7;
  --text-100: #e3e3e8;
  --text-200: #c7c7cc;
  --text-300: #aeaeb2;
  --text-400: #8e8e93;
  --text-500: #6e6e73;
  --text-600: #48484a;
  --text-700: #3c3c43;
  --text-800: #1d1d1f;
  --text-900: #000000;

  /* icon */
  --icon-50: #f5f5f7;
  --icon-100: #e5e5ea;
  --icon-200: #d1d1d6;
  --icon-300: #c7c7cc;
  --icon-400: #aeaeb2;
  --icon-500: #8e8e93;
  --icon-600: #6e6e73;
  --icon-700: #48484a;
  --icon-800: #2c2c2e;
  --icon-900: #1d1d1f;

  /* state-success */
  --state-success: #34c759; /* @primary */
  --state-success-dark: #30d158;
  --state-success-surface: #e9f9ee;
  --state-success-foreground: #ffffff;

  /* state-error */
  --state-error: #ff3b30; /* @primary */
  --state-error-dark: #ff453a;
  --state-error-surface: #ffecea;
  --state-error-foreground: #ffffff;

  /* ===== SEMANTIC ROLES ===== */

  /* semantic */
  --background: var(--background-50);
  --foreground: var(--text-800);
  --card: var(--background-50);
  --card-foreground: var(--text-800);
  --popover: var(--background-50);
  --popover-foreground: var(--text-900);

  --primary: var(--brand-500);
  --primary-foreground: var(--background-50);
  --secondary: var(--background-200);
  --secondary-foreground: var(--text-800);
  --muted: var(--background-200);
  --muted-foreground: var(--text-400);
  --accent: var(--background-100);
  --accent-foreground: var(--text-800);
  --destructive: var(--state-error);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-300);
  --input: var(--background-400);
  --ring: var(--brand-500);

  --icon: var(--icon-900);
  --icon-muted: var(--icon-500);

  /* chart */
  --chart-1: var(--state-success);
  --chart-2: var(--brand-500);
  --chart-3: #ff9500;
  --chart-4: #5856d6;
  --chart-5: #af52de;

  /* sidebar */
  --sidebar: var(--background-200);
  --sidebar-foreground: var(--text-800);
  --sidebar-primary: var(--brand-500);
  --sidebar-primary-foreground: var(--background-50);
  --sidebar-accent: var(--background-300);
  --sidebar-accent-foreground: var(--text-800);
  --sidebar-border: var(--background-300);
  --sidebar-ring: var(--brand-500);

  /* TYPOGRAPHY */
  --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;
  --tracking-normal: 0em;

  /* RADIUS */
  --radius: 1.2rem;

  /* SHADOWS */
  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.04); /* Hairline */
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04); /* Subtle */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05), 0 1px 3px -1px rgba(0, 0, 0, 0.05); /* Card */
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.05); /* Raised */
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.05); /* Card Hover */
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.08), 0 4px 8px -4px rgba(0, 0, 0, 0.05); /* Float */
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.10), 0 8px 16px -8px rgba(0, 0, 0, 0.06); /* Overlay */
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.12); /* Modal */

  /* SPACING */
  --spacing: 0.24rem;
}

/* ===== SEMANTIC ROLES - dark (primitive palette inherited) ===== */
.dark {
  --background: var(--background-900);
  --foreground: var(--text-50);
  --card: var(--background-800);
  --card-foreground: var(--text-50);
  --popover: var(--background-700);
  --popover-foreground: var(--text-50);

  --primary: var(--brand-400);
  --primary-foreground: var(--background-900);
  --secondary: var(--background-800);
  --secondary-foreground: var(--text-50);
  --muted: var(--background-800);
  --muted-foreground: var(--text-400);
  --accent: var(--background-700);
  --accent-foreground: var(--text-50);
  --destructive: var(--state-error-dark);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success-dark);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-700);
  --input: var(--background-700);
  --ring: var(--brand-400);

  --icon: var(--icon-50);
  --icon-muted: var(--icon-500);

  --chart-1: var(--state-success-dark);
  --chart-2: var(--brand-400);
  --chart-3: #ff9f0a;
  --chart-4: #5e5ce6;
  --chart-5: #bf5af2;

  --sidebar: var(--background-800);
  --sidebar-foreground: var(--text-50);
  --sidebar-primary: var(--brand-400);
  --sidebar-primary-foreground: var(--background-900);
  --sidebar-accent: var(--background-700);
  --sidebar-accent-foreground: var(--text-50);
  --sidebar-border: var(--background-700);
  --sidebar-ring: var(--brand-400);

  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.30);
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.30);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.36), 0 1px 3px -1px rgba(0, 0, 0, 0.36);
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.40), 0 1px 2px -1px rgba(0, 0, 0, 0.36);
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.44), 0 2px 4px -2px rgba(0, 0, 0, 0.36);
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.50), 0 4px 8px -4px rgba(0, 0, 0, 0.40);
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.55), 0 8px 16px -8px rgba(0, 0, 0, 0.44);
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.60);
}

/* radius semantic bridge - derived from Library --radius (1.2rem = 19.2px) */:root {
  --apple-radius-sm: calc(var(--radius) * 0.42);
  --apple-radius-md: calc(var(--radius) * 0.75);
  --apple-radius-lg: var(--radius);
}

    <main>
        <style id="critical-layout">
            /* ===== 提醒场景：桌面氛围 + 系统通知卡片 + 主界面局部 ===== */
            /* 无运行时稳定性：壳层与关键布局均不依赖 Tailwind 运行时 */
            * { box-sizing: border-box; }
            body { margin: 0; font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
            main {
                width: 100%;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--apple-background);
            }
            .stage {
                position: relative;
                width: 400px;
                min-height: 640px;
                max-width: 100%;
                overflow: hidden;
                background: linear-gradient(158deg, var(--apple-background) 0%, var(--apple-accent) 58%, var(--apple-muted) 100%);
            }

            /* 桌面窗口剪影 */
            .win-ghost {
                position: absolute;
                border: 1px solid var(--apple-border);
                border-radius: 12px;
                background: color-mix(in srgb, var(--apple-card) 46%, transparent);
                box-shadow: var(--shadow-sm);
            }
            .win-ghost-a { top: 96px; right: 8px; width: 168px; height: 108px; }
            .win-ghost-b { top: 240px; left: 6px; width: 120px; height: 76px; }
            .ghost-bar {
                height: 22px;
                margin: 0 10px;
                border-bottom: 1px solid color-mix(in srgb, var(--apple-border) 70%, transparent);
            }
            .ghost-dot {
                display: inline-block;
                width: 6px;
                height: 6px;
                margin-top: 8px;
                margin-right: 4px;
                border-radius: 999px;
                background: var(--apple-border);
            }
            .ghost-line {
                height: 5px;
                margin: 8px 10px 0;
                border-radius: 3px;
                background: color-mix(in srgb, var(--apple-border) 45%, transparent);
            }

            /* 主界面局部（半透明便签应用窗口） */
            .app-win {
                position: absolute;
                left: 8px;
                bottom: 148px;
                width: 176px;
                overflow: hidden;
                border: 1px solid var(--apple-border);
                border-radius: 14px;
                background: color-mix(in srgb, var(--apple-card) 82%, transparent);
                backdrop-filter: blur(16px) saturate(1.35);
                -webkit-backdrop-filter: blur(16px) saturate(1.35);
                box-shadow: var(--shadow-lg);
            }
            .app-win-bar {
                display: flex;
                align-items: center;
                gap: 4px;
                height: 28px;
                padding: 0 10px;
                border-bottom: 1px solid var(--apple-border);
            }
            .app-win-dot { width: 6px; height: 6px; border-radius: 999px; background: var(--apple-border); }
            .app-win-title { margin: 0 0 0 4px; font-size: 10px; font-weight: 600; color: var(--apple-muted-foreground); }
            .note-list { display: flex; flex-direction: column; gap: 6px; padding: 8px; }
            .note-card {
                padding: 7px 8px;
                border: 1px solid var(--apple-border);
                border-radius: var(--apple-radius-sm);
                background: color-mix(in srgb, var(--apple-card) 78%, transparent);
            }
            .note-card.is-remind {
                border-color: color-mix(in srgb, var(--apple-primary) 38%, transparent);
                background: color-mix(in srgb, var(--apple-primary) 7%, var(--apple-card));
            }
            .note-card-top { display: flex; align-items: center; gap: 6px; }
            .note-card-title {
                margin: 0;
                flex: 1;
                min-width: 0;
                font-size: 11px;
                font-weight: 600;
                line-height: 1.3;
                color: var(--apple-foreground);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .note-card-meta { margin: 3px 0 0; font-size: 10px; line-height: 1.35; color: var(--apple-muted-foreground); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
            .remind-badge {
                flex: none;
                display: flex;
                align-items: center;
                gap: 2px;
                padding: 2px 6px;
                border-radius: 999px;
                background: color-mix(in srgb, var(--apple-primary) 12%, transparent);
                color: var(--apple-primary);
                font-size: 10px;
                font-weight: 600;
                white-space: nowrap;
            }
            .remind-badge svg { width: 10px; height: 10px; }

            /* 系统通知卡片（右下角，类 Web Notification） */
            .notif-card {
                position: absolute;
                right: 8px;
                bottom: 56px;
                width: 200px;
                padding: 12px;
                border: 1px solid var(--apple-border);
                border-radius: 14px;
                background: color-mix(in srgb, var(--apple-card) 86%, transparent);
                backdrop-filter: blur(18px) saturate(1.4);
                -webkit-backdrop-filter: blur(18px) saturate(1.4);
                box-shadow: var(--shadow-xl);
                cursor: pointer;
            }
            .notif-head { display: flex; align-items: center; gap: 8px; }
            .notif-bell {
                flex: none;
                width: 36px;
                height: 36px;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 999px;
                background: color-mix(in srgb, var(--apple-primary) 13%, transparent);
                color: var(--apple-primary);
            }
            .notif-bell svg { width: 18px; height: 18px; }
            .notif-id { flex: 1; min-width: 0; }
            .notif-app { margin: 0; font-size: 11px; font-weight: 600; color: var(--apple-foreground); }
            .notif-time { margin: 1px 0 0; font-size: 10px; color: var(--apple-muted-foreground); }
            .notif-close {
                flex: none;
                width: 24px;
                height: 24px;
                display: flex;
                align-items: center;
                justify-content: center;
                border: 0;
                border-radius: 999px;
                background: transparent;
                color: var(--apple-muted-foreground);
                cursor: pointer;
            }
            .notif-close svg { width: 13px; height: 13px; }
            .notif-title { margin: 10px 0 0; font-size: 14px; font-weight: 600; line-height: 1.35; color: var(--apple-foreground); }
            .notif-body { margin: 4px 0 0; font-size: 12px; line-height: 1.55; color: var(--apple-foreground); opacity: .86; }
            .notif-action {
                margin-top: 10px;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 5px;
                width: 100%;
                height: 30px;
                border: 0;
                border-radius: 999px;
                background: var(--apple-primary);
                color: var(--apple-primary-foreground);
                font-size: 11px;
                font-weight: 600;
                cursor: pointer;
            }
            .notif-action svg { width: 12px; height: 12px; }

            /* 说明行 */
            .stage-hint {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 14px;
                margin: 0;
                text-align: center;
                font-size: 11px;
                color: var(--apple-muted-foreground);
            }
        </style>
        <style id="page-styles">
            /* 动效与交互增强（运行时仅做增强） */
            .win-ghost-b { transform: rotate(-1.2deg); }
            .notif-card {
                transition: transform .18s cubic-bezier(.32, .72, 0, 1), box-shadow .18s cubic-bezier(.32, .72, 0, 1);
            }
            .notif-bell { animation: bell-pulse 2.6s ease-in-out infinite; }
            @keyframes bell-pulse {
                0%, 100% { transform: scale(1); }
                50% { transform: scale(1.06); }
            }
            .notif-close, .notif-action { transition: opacity .15s, transform .15s, background-color .15s; }
            .notif-action:active { transform: scale(.97); }
            /* ===== 桌面 hover：仅指针设备生效 ===== */
            @media (hover: hover) and (pointer: fine) {
                .notif-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-2xl); }
                .notif-close:hover { background: var(--state-error-surface); color: var(--apple-destructive); }
                .notif-action:hover { opacity: .92; }
            }
            /* ===== 键盘可达性 ===== */
            .notif-card:focus-visible, .notif-close:focus-visible, .notif-action:focus-visible, button:focus-visible {
                outline: 2px solid var(--apple-ring);
                outline-offset: 2px;
            }
            @media (prefers-reduced-motion: reduce) {
                *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
            }
        </style>

        <div class="stage" id="stage" role="img" aria-label="便签到点提醒场景">
            <!-- 桌面窗口剪影 1/2 -->
            <div class="win-ghost win-ghost-a" aria-hidden="true">
                <div class="ghost-bar">
                    <span class="ghost-dot"></span><span class="ghost-dot"></span><span class="ghost-dot"></span>
                </div>
                <div class="ghost-line"></div>
                <div class="ghost-line"></div>
            </div>
            <div class="win-ghost win-ghost-b" aria-hidden="true">
                <div class="ghost-bar">
                    <span class="ghost-dot"></span><span class="ghost-dot"></span>
                </div>
                <div class="ghost-line"></div>
            </div>

            <!-- 主界面局部：便签列表（其中 1 张带提醒铃铛标记） -->
            <div class="app-win" aria-hidden="true">
                <div class="app-win-bar">
                    <span class="app-win-dot"></span><span class="app-win-dot"></span><span class="app-win-dot"></span>
                    <p class="app-win-title">便签</p>
                </div>
                <div class="note-list">
                    <article class="note-card is-remind">
                        <div class="note-card-top">
                            <p class="note-card-title">客户交期确认</p>
                            <span class="remind-badge"><i data-lucide="bell" aria-hidden="true"></i>10:00</span>
                        </div>
                        <p class="note-card-meta">王经理确认 08/12 发货，含 6 款料…</p>
                    </article>
                    <article class="note-card">
                        <div class="note-card-top">
                            <p class="note-card-title">周会要点</p>
                        </div>
                        <p class="note-card-meta">09:40 更新</p>
                    </article>
                </div>
            </div>

            <!-- 系统通知卡片（右下角，类 Web Notification 形态） -->
            <aside class="notif-card" tabindex="0" aria-label="通知：客户交期确认，点击查看备忘">
                <div class="notif-head">
                    <span class="notif-bell"><i data-lucide="bell-ring" aria-hidden="true"></i></span>
                    <div class="notif-id">
                        <p class="notif-app">领益工作助手</p>
                        <p class="notif-time">10:00</p>
                    </div>
                    <button class="notif-close" type="button" aria-label="关闭通知" title="关闭通知"><i data-lucide="x" aria-hidden="true"></i></button>
                </div>
                <h2 class="notif-title">客户交期确认</h2>
                <p class="notif-body">王经理确认 08/12 发货，含 6 款料…</p>
                <button class="notif-action" type="button"><i data-lucide="eye" aria-hidden="true"></i>点击查看备忘</button>
            </aside>

            <p class="stage-hint">到点自动提醒，支持免打扰/稍后提醒</p>
        </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
