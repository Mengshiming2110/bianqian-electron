    <style id="theme-vars">
/*
 * Pinguo design tokens
 * Brand: Pinguo
 * Domain: Consumer imaging product
 * Style: Restrained, elegant, Apple-inspired
 * Theme mode: light-dark
 * Source language: zh
 * Output language: en
 *
 * Color architecture (two layers):
 *   1. Primitive palette - six categories. brand / background / text / icon
 *      are each a 10-step scale (50 lightest to 900 darkest). state-success and
 *      state-error are functional colors anchored on Apple system colors.
 *      Anchors follow Apple Human Interface Guidelines system colors
 *      (System Blue #007AFF, System Green #34C759, System Red #FF3B30,
 *      system grays / label / background colors).
 *   2. Semantic tokens - :root (light) and .dark map roles onto primitives.
 *      Components and UI kits must only consume the semantic tokens below.
 */

/* @group-priority: brand, background, text, icon, state-success, state-error */

:root {
  
  /* solo-design consumption aliases: explicit prefix for fill-html-head.mjs */
  --apple-background: var(--background, #ffffff);
  --apple-foreground: var(--foreground, #0f172a);
  --apple-card: var(--card, var(--background));
  --apple-card-foreground: var(--card-foreground, var(--foreground));
  --apple-popover: var(--popover, var(--card));
  --apple-popover-foreground: var(--popover-foreground, var(--card-foreground, var(--foreground)));
  --apple-primary: var(--primary, #111827);
  --apple-primary-foreground: var(--primary-foreground, #ffffff);
  --apple-secondary: var(--secondary, var(--muted, var(--card)));
  --apple-secondary-foreground: var(--secondary-foreground, var(--foreground));
  --apple-muted: var(--muted, var(--card));
  --apple-muted-foreground: var(--muted-foreground, var(--foreground));
  --apple-accent: var(--accent, var(--secondary, var(--muted, var(--card))));
  --apple-accent-foreground: var(--accent-foreground, var(--foreground));
  --apple-destructive: var(--destructive, #ef4444);
  --apple-destructive-foreground: var(--destructive-foreground, #ffffff);
  --apple-border: var(--border, currentColor);
  --apple-input: var(--input, var(--border));
  --apple-ring: var(--ring, var(--primary));
  --apple-chart-1: var(--chart-1, var(--primary));
  --apple-chart-2: var(--chart-2, var(--secondary, var(--primary)));
  --apple-chart-3: var(--chart-3, var(--accent, var(--primary)));
  --apple-chart-4: var(--chart-4, var(--muted-foreground, var(--foreground)));
  --apple-chart-5: var(--chart-5, var(--foreground));
  --apple-sidebar: var(--sidebar, var(--background));
  --apple-sidebar-foreground: var(--sidebar-foreground, var(--foreground));
  --apple-sidebar-primary: var(--sidebar-primary, var(--primary));
  --apple-sidebar-primary-foreground: var(--sidebar-primary-foreground, var(--primary-foreground));
  --apple-sidebar-accent: var(--sidebar-accent, var(--accent, var(--muted, var(--card))));
  --apple-sidebar-accent-foreground: var(--sidebar-accent-foreground, var(--accent-foreground, var(--foreground)));

/* ===== PRIMITIVE PALETTE ===== */

  /* brand */
  --brand-50: #e8f2ff;
  --brand-100: #cfe5ff;
  --brand-200: #9fcbff;
  --brand-300: #66abff;
  --brand-400: #2e8dff;
  --brand-500: #007aff; /* @primary */
  --brand-600: #0064d6;
  --brand-700: #004fad;
  --brand-800: #003b82;
  --brand-900: #00275a;

  /* background */
  --background-50: #ffffff;
  --background-100: #f7f7fa;
  --background-200: #f2f2f7;
  --background-300: #e5e5ea;
  --background-400: #d1d1d6;
  --background-500: #aeaeb2;
  --background-600: #8e8e93;
  --background-700: #3a3a3c;
  --background-800: #1c1c1e;
  --background-900: #000000;

  /* text */
  --text-50: #f5f5f7;
  --text-100: #e3e3e8;
  --text-200: #c7c7cc;
  --text-300: #aeaeb2;
  --text-400: #8e8e93;
  --text-500: #6e6e73;
  --text-600: #48484a;
  --text-700: #3c3c43;
  --text-800: #1d1d1f;
  --text-900: #000000;

  /* icon */
  --icon-50: #f5f5f7;
  --icon-100: #e5e5ea;
  --icon-200: #d1d1d6;
  --icon-300: #c7c7cc;
  --icon-400: #aeaeb2;
  --icon-500: #8e8e93;
  --icon-600: #6e6e73;
  --icon-700: #48484a;
  --icon-800: #2c2c2e;
  --icon-900: #1d1d1f;

  /* state-success */
  --state-success: #34c759; /* @primary */
  --state-success-dark: #30d158;
  --state-success-surface: #e9f9ee;
  --state-success-foreground: #ffffff;

  /* state-error */
  --state-error: #ff3b30; /* @primary */
  --state-error-dark: #ff453a;
  --state-error-surface: #ffecea;
  --state-error-foreground: #ffffff;

  /* ===== SEMANTIC ROLES ===== */

  /* semantic */
  --background: var(--background-50);
  --foreground: var(--text-800);
  --card: var(--background-50);
  --card-foreground: var(--text-800);
  --popover: var(--background-50);
  --popover-foreground: var(--text-900);

  --primary: var(--brand-500);
  --primary-foreground: var(--background-50);
  --secondary: var(--background-200);
  --secondary-foreground: var(--text-800);
  --muted: var(--background-200);
  --muted-foreground: var(--text-400);
  --accent: var(--background-100);
  --accent-foreground: var(--text-800);
  --destructive: var(--state-error);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-300);
  --input: var(--background-400);
  --ring: var(--brand-500);

  --icon: var(--icon-900);
  --icon-muted: var(--icon-500);

  /* chart */
  --chart-1: var(--state-success);
  --chart-2: var(--brand-500);
  --chart-3: #ff9500;
  --chart-4: #5856d6;
  --chart-5: #af52de;

  /* sidebar */
  --sidebar: var(--background-200);
  --sidebar-foreground: var(--text-800);
  --sidebar-primary: var(--brand-500);
  --sidebar-primary-foreground: var(--background-50);
  --sidebar-accent: var(--background-300);
  --sidebar-accent-foreground: var(--text-800);
  --sidebar-border: var(--background-300);
  --sidebar-ring: var(--brand-500);

  /* TYPOGRAPHY */
  --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;
  --tracking-normal: 0em;

  /* RADIUS */
  --radius: 1.2rem;

  /* SHADOWS */
  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.04); /* Hairline */
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04); /* Subtle */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05), 0 1px 3px -1px rgba(0, 0, 0, 0.05); /* Card */
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.05); /* Raised */
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.05); /* Card Hover */
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.08), 0 4px 8px -4px rgba(0, 0, 0, 0.05); /* Float */
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.10), 0 8px 16px -8px rgba(0, 0, 0, 0.06); /* Overlay */
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.12); /* Modal */

  /* SPACING */
  --spacing: 0.24rem;
}

/* ===== SEMANTIC ROLES - dark (primitive palette inherited) ===== */
.dark {
  --background: var(--background-900);
  --foreground: var(--text-50);
  --card: var(--background-800);
  --card-foreground: var(--text-50);
  --popover: var(--background-700);
  --popover-foreground: var(--text-50);

  --primary: var(--brand-400);
  --primary-foreground: var(--background-900);
  --secondary: var(--background-800);
  --secondary-foreground: var(--text-50);
  --muted: var(--background-800);
  --muted-foreground: var(--text-400);
  --accent: var(--background-700);
  --accent-foreground: var(--text-50);
  --destructive: var(--state-error-dark);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success-dark);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-700);
  --input: var(--background-700);
  --ring: var(--brand-400);

  --icon: var(--icon-50);
  --icon-muted: var(--icon-500);

  --chart-1: var(--state-success-dark);
  --chart-2: var(--brand-400);
  --chart-3: #ff9f0a;
  --chart-4: #5e5ce6;
  --chart-5: #bf5af2;

  --sidebar: var(--background-800);
  --sidebar-foreground: var(--text-50);
  --sidebar-primary: var(--brand-400);
  --sidebar-primary-foreground: var(--background-900);
  --sidebar-accent: var(--background-700);
  --sidebar-accent-foreground: var(--text-50);
  --sidebar-border: var(--background-700);
  --sidebar-ring: var(--brand-400);

  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.30);
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.30);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.36), 0 1px 3px -1px rgba(0, 0, 0, 0.36);
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.40), 0 1px 2px -1px rgba(0, 0, 0, 0.36);
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.44), 0 2px 4px -2px rgba(0, 0, 0, 0.36);
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.50), 0 4px 8px -4px rgba(0, 0, 0, 0.40);
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.55), 0 8px 16px -8px rgba(0, 0, 0, 0.44);
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.60);
}

/* radius semantic bridge - derived from Library --radius (1.2rem = 19.2px) */:root {
  --apple-radius-sm: calc(var(--radius) * 0.42);
  --apple-radius-md: calc(var(--radius) * 0.75);
  --apple-radius-lg: var(--radius);
}

<style id="critical-layout">
/* ===== 设置子面板 · 两级导航静态布局（不依赖运行时） ===== */
:root{--apple-brand-soft:color-mix(in srgb,var(--brand-500) 12%,var(--apple-card))}
.dark{--apple-brand-soft:color-mix(in srgb,var(--brand-500) 22%,var(--apple-card))}
body{margin:0;background:var(--apple-background);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
.app-frame{width:400px;min-height:640px;margin-inline:auto;background:var(--apple-background);box-shadow:var(--shadow-lg);display:flex;flex-direction:column}
.app-content{flex:1;padding:16px 16px 40px;overflow-y:auto;min-width:0}
/* 面板标签 */
.panel-caption{display:flex;align-items:center;gap:6px;margin:14px 4px 6px}
.panel-caption:first-of-type{margin-top:4px}
.panel-chip{height:18px;padding:0 8px;border-radius:999px;font-size:10px;font-weight:600;line-height:18px;background:var(--apple-accent);color:var(--apple-muted-foreground);flex:none}
.panel-chip.is-main{background:var(--apple-brand-soft);color:var(--apple-primary)}
.panel-caption-label{font-size:11px;color:var(--apple-muted-foreground)}
/* 设置卡片 */
.settings-card{display:flex;flex-direction:column;gap:4px;padding:8px;background:var(--apple-card);border:1px solid var(--apple-border);border-radius:var(--apple-radius-md);box-shadow:var(--shadow-xs)}
.settings-card+.panel-caption{margin-top:18px}
.settings-card-head{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 6px}
.head-icon{width:16px;height:16px;color:var(--apple-primary);flex:none}
.panel-title{margin:0;flex:1;font-size:14px;font-weight:700;letter-spacing:-.01em;color:var(--apple-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:32px;height:32px;padding:0;border:0;border-radius:999px;background:transparent;color:var(--apple-muted-foreground);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.icon-btn svg{width:16px;height:16px}
.back-btn{width:32px;height:32px;padding:0;border:1px solid var(--apple-border);border-radius:999px;background:var(--apple-card);color:var(--apple-foreground);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.back-btn svg{width:15px;height:15px}
/* 透明度滑杆行 */
.slider-row{display:flex;align-items:center;gap:9px;height:44px;padding:0 9px}
.slider-icon{width:15px;height:15px;color:var(--apple-muted-foreground);flex:none}
.slider-label{font-size:13px;color:var(--apple-foreground);white-space:nowrap}
.slider-input{flex:1;min-width:0;height:4px;margin:0;accent-color:var(--apple-primary);cursor:pointer}
.slider-value{min-width:34px;text-align:right;font-size:11px;font-weight:600;color:var(--apple-foreground)}
/* 入口行 */
.menu-row{display:flex;align-items:center;gap:8px;height:44px;padding:0 9px;border:0;border-radius:var(--apple-radius-sm);background:transparent;color:var(--apple-foreground);font:inherit;text-align:left;cursor:pointer;width:100%}
.menu-row.is-active{background:var(--apple-brand-soft)}
.menu-row.is-active .menu-label,.menu-row.is-active .menu-value,.menu-row.is-active .menu-chevron{color:var(--apple-primary)}
.menu-label{flex:1;min-width:0;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-value{font-size:11px;color:var(--apple-muted-foreground);white-space:nowrap}
.menu-chevron{width:15px;height:15px;color:var(--apple-muted-foreground);flex:none}
/* 列表行 */
.row-list{display:flex;flex-direction:column;gap:2px}
.list-row{display:flex;align-items:center;gap:9px;height:44px;padding:0 9px;border:0;border-radius:var(--apple-radius-sm);background:transparent;color:var(--apple-foreground);font:inherit;text-align:left;cursor:pointer;width:100%}
.list-row.is-active{background:var(--apple-brand-soft);color:var(--apple-primary)}
.row-icon{width:16px;height:16px;color:var(--apple-muted-foreground);flex:none}
.list-row.is-active .row-icon{color:var(--apple-primary)}
.row-name{flex:1;min-width:0;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-check{width:16px;height:16px;color:var(--apple-primary);flex:none}
</style>
<style id="page-styles">
/* ===== 交互增强（运行时仅做增强） ===== */
.settings-card{transition:border-color .15s cubic-bezier(.32,.72,0,1),box-shadow .15s cubic-bezier(.32,.72,0,1)}
.menu-row,.list-row{transition:background-color .15s cubic-bezier(.32,.72,0,1),color .15s cubic-bezier(.32,.72,0,1)}
.icon-btn,.back-btn{transition:background-color .15s,color .15s,transform .15s}
.icon-btn:active,.back-btn:active{transform:scale(.96)}
.slider-input{transition:accent-color .15s}
.slider-input:focus-visible{outline:2px solid var(--apple-ring);outline-offset:2px}
button:focus-visible{outline:2px solid var(--apple-ring);outline-offset:2px}
/* ===== 桌面 hover（仅精确指针设备；入口行品牌软底） ===== */
@media (hover: hover) and (pointer: fine){
.settings-card:hover{border-color:var(--apple-accent);box-shadow:var(--shadow-sm)}
.menu-row:hover,.list-row:hover{background:color-mix(in srgb,var(--apple-primary) 8%,transparent)}
.menu-row:hover .menu-label,.menu-row:hover .menu-value,.menu-row:hover .menu-chevron{color:var(--apple-primary)}
.list-row:hover{color:var(--apple-primary)}
.list-row:hover .row-icon{color:var(--apple-primary)}
.icon-btn:hover,.back-btn:hover{background:var(--apple-secondary);color:var(--apple-foreground)}
}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
<div class="app-frame" id="app-frame">
  <div class="app-content no-scrollbar">
    <!-- 主面板 · 设置 -->
    <div class="panel-caption">
      <span class="panel-chip is-main">主面板</span>
      <span class="panel-caption-label">当前面板 · 设置</span>
    </div>
    <section class="settings-card" aria-label="设置主面板">
      <header class="settings-card-head">
        <i data-lucide="settings" class="head-icon" aria-hidden="true"></i>
        <h2 class="panel-title">设置</h2>
        <button class="icon-btn" type="button" aria-label="关闭" title="关闭"><i data-lucide="x" aria-hidden="true"></i></button>
      </header>
      <div class="slider-row">
        <i data-lucide="sliders-horizontal" class="slider-icon" aria-hidden="true"></i>
        <span class="slider-label">透明度</span>
        <input class="slider-input" type="range" min="35" max="100" step="5" value="92" aria-label="透明度">
        <strong class="slider-value">92%</strong>
      </div>
      <button class="menu-row is-active" type="button">
        <span class="menu-label">分类筛选</span>
        <span class="menu-value">全部</span>
        <i data-lucide="chevron-right" class="menu-chevron" aria-hidden="true"></i>
      </button>
      <button class="menu-row" type="button">
        <span class="menu-label">主题</span>
        <span class="menu-value">跟随系统</span>
        <i data-lucide="chevron-right" class="menu-chevron" aria-hidden="true"></i>
      </button>
      <button class="menu-row" type="button">
        <span class="menu-label">显示预设</span>
        <span class="menu-value">常规</span>
        <i data-lucide="chevron-right" class="menu-chevron" aria-hidden="true"></i>
      </button>
    </section>
    <!-- 分类筛选子面板 -->
    <div class="panel-caption">
      <span class="panel-chip">子面板</span>
      <span class="panel-caption-label">当前面板 · 分类筛选</span>
    </div>
    <section class="settings-card" aria-label="分类筛选子面板">
      <header class="settings-card-head">
        <button class="back-btn" type="button" aria-label="返回" title="返回"><i data-lucide="arrow-left" aria-hidden="true"></i></button>
        <h2 class="panel-title">分类筛选</h2>
      </header>
      <div class="row-list">
        <button class="list-row is-active" type="button" aria-pressed="true"><span class="row-name">全部</span><i data-lucide="check" class="row-check" aria-hidden="true"></i></button>
        <button class="list-row" type="button" aria-pressed="false"><span class="row-name">工作</span></button>
        <button class="list-row" type="button" aria-pressed="false"><span class="row-name">生活</span></button>
        <button class="list-row" type="button" aria-pressed="false"><span class="row-name">学习</span></button>
        <button class="list-row" type="button" aria-pressed="false"><span class="row-name">会议</span></button>
        <button class="list-row" type="button" aria-pressed="false"><span class="row-name">其他</span></button>
      </div>
    </section>
    <!-- 主题子面板 -->
    <div class="panel-caption">
      <span class="panel-chip">子面板</span>
      <span class="panel-caption-label">当前面板 · 主题</span>
    </div>
    <section class="settings-card" aria-label="主题子面板">
      <header class="settings-card-head">
        <button class="back-btn" type="button" aria-label="返回" title="返回"><i data-lucide="arrow-left" aria-hidden="true"></i></button>
        <h2 class="panel-title">主题</h2>
      </header>
      <div class="row-list">
        <button class="list-row is-active" type="button" aria-pressed="true"><i data-lucide="sun-moon" class="row-icon" aria-hidden="true"></i><span class="row-name">跟随系统</span><i data-lucide="check" class="row-check" aria-hidden="true"></i></button>
        <button class="list-row" type="button" aria-pressed="false"><i data-lucide="sun" class="row-icon" aria-hidden="true"></i><span class="row-name">浅色</span></button>
        <button class="list-row" type="button" aria-pressed="false"><i data-lucide="moon" class="row-icon" aria-hidden="true"></i><span class="row-name">深色</span></button>
      </div>
    </section>
  </div>
</div>
<script>
  (function(){var s=document.querySelector('.slider-input'),v=document.querySelector('.slider-value');if(s&&v){var sync=function(){v.textContent=s.value+'%'};s.addEventListener('input',sync)}})();
</script>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
