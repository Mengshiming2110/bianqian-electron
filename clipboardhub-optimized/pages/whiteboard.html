    <style id="theme-vars">
/*
 * Pinguo design tokens
 * Brand: Pinguo
 * Domain: Consumer imaging product
 * Style: Restrained, elegant, Apple-inspired
 * Theme mode: light-dark
 * Source language: zh
 * Output language: en
 *
 * Color architecture (two layers):
 *   1. Primitive palette - six categories. brand / background / text / icon
 *      are each a 10-step scale (50 lightest to 900 darkest). state-success and
 *      state-error are functional colors anchored on Apple system colors.
 *      Anchors follow Apple Human Interface Guidelines system colors
 *      (System Blue #007AFF, System Green #34C759, System Red #FF3B30,
 *      system grays / label / background colors).
 *   2. Semantic tokens - :root (light) and .dark map roles onto primitives.
 *      Components and UI kits must only consume the semantic tokens below.
 */

/* @group-priority: brand, background, text, icon, state-success, state-error */

:root {
  
  /* solo-design consumption aliases: explicit prefix for fill-html-head.mjs */
  --apple-background: var(--background, #ffffff);
  --apple-foreground: var(--foreground, #0f172a);
  --apple-card: var(--card, var(--background));
  --apple-card-foreground: var(--card-foreground, var(--foreground));
  --apple-popover: var(--popover, var(--card));
  --apple-popover-foreground: var(--popover-foreground, var(--card-foreground, var(--foreground)));
  --apple-primary: var(--primary, #111827);
  --apple-primary-foreground: var(--primary-foreground, #ffffff);
  --apple-secondary: var(--secondary, var(--muted, var(--card)));
  --apple-secondary-foreground: var(--secondary-foreground, var(--foreground));
  --apple-muted: var(--muted, var(--card));
  --apple-muted-foreground: var(--muted-foreground, var(--foreground));
  --apple-accent: var(--accent, var(--secondary, var(--muted, var(--card))));
  --apple-accent-foreground: var(--accent-foreground, var(--foreground));
  --apple-destructive: var(--destructive, #ef4444);
  --apple-destructive-foreground: var(--destructive-foreground, #ffffff);
  --apple-border: var(--border, currentColor);
  --apple-input: var(--input, var(--border));
  --apple-ring: var(--ring, var(--primary));
  --apple-chart-1: var(--chart-1, var(--primary));
  --apple-chart-2: var(--chart-2, var(--secondary, var(--primary)));
  --apple-chart-3: var(--chart-3, var(--accent, var(--primary)));
  --apple-chart-4: var(--chart-4, var(--muted-foreground, var(--foreground)));
  --apple-chart-5: var(--chart-5, var(--foreground));
  --apple-sidebar: var(--sidebar, var(--background));
  --apple-sidebar-foreground: var(--sidebar-foreground, var(--foreground));
  --apple-sidebar-primary: var(--sidebar-primary, var(--primary));
  --apple-sidebar-primary-foreground: var(--sidebar-primary-foreground, var(--primary-foreground));
  --apple-sidebar-accent: var(--sidebar-accent, var(--accent, var(--muted, var(--card))));
  --apple-sidebar-accent-foreground: var(--sidebar-accent-foreground, var(--accent-foreground, var(--foreground)));

/* ===== PRIMITIVE PALETTE ===== */

  /* brand */
  --brand-50: #e8f2ff;
  --brand-100: #cfe5ff;
  --brand-200: #9fcbff;
  --brand-300: #66abff;
  --brand-400: #2e8dff;
  --brand-500: #007aff; /* @primary */
  --brand-600: #0064d6;
  --brand-700: #004fad;
  --brand-800: #003b82;
  --brand-900: #00275a;

  /* background */
  --background-50: #ffffff;
  --background-100: #f7f7fa;
  --background-200: #f2f2f7;
  --background-300: #e5e5ea;
  --background-400: #d1d1d6;
  --background-500: #aeaeb2;
  --background-600: #8e8e93;
  --background-700: #3a3a3c;
  --background-800: #1c1c1e;
  --background-900: #000000;

  /* text */
  --text-50: #f5f5f7;
  --text-100: #e3e3e8;
  --text-200: #c7c7cc;
  --text-300: #aeaeb2;
  --text-400: #8e8e93;
  --text-500: #6e6e73;
  --text-600: #48484a;
  --text-700: #3c3c43;
  --text-800: #1d1d1f;
  --text-900: #000000;

  /* icon */
  --icon-50: #f5f5f7;
  --icon-100: #e5e5ea;
  --icon-200: #d1d1d6;
  --icon-300: #c7c7cc;
  --icon-400: #aeaeb2;
  --icon-500: #8e8e93;
  --icon-600: #6e6e73;
  --icon-700: #48484a;
  --icon-800: #2c2c2e;
  --icon-900: #1d1d1f;

  /* state-success */
  --state-success: #34c759; /* @primary */
  --state-success-dark: #30d158;
  --state-success-surface: #e9f9ee;
  --state-success-foreground: #ffffff;

  /* state-error */
  --state-error: #ff3b30; /* @primary */
  --state-error-dark: #ff453a;
  --state-error-surface: #ffecea;
  --state-error-foreground: #ffffff;

  /* ===== SEMANTIC ROLES ===== */

  /* semantic */
  --background: var(--background-50);
  --foreground: var(--text-800);
  --card: var(--background-50);
  --card-foreground: var(--text-800);
  --popover: var(--background-50);
  --popover-foreground: var(--text-900);

  --primary: var(--brand-500);
  --primary-foreground: var(--background-50);
  --secondary: var(--background-200);
  --secondary-foreground: var(--text-800);
  --muted: var(--background-200);
  --muted-foreground: var(--text-400);
  --accent: var(--background-100);
  --accent-foreground: var(--text-800);
  --destructive: var(--state-error);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-300);
  --input: var(--background-400);
  --ring: var(--brand-500);

  --icon: var(--icon-900);
  --icon-muted: var(--icon-500);

  /* chart */
  --chart-1: var(--state-success);
  --chart-2: var(--brand-500);
  --chart-3: #ff9500;
  --chart-4: #5856d6;
  --chart-5: #af52de;

  /* sidebar */
  --sidebar: var(--background-200);
  --sidebar-foreground: var(--text-800);
  --sidebar-primary: var(--brand-500);
  --sidebar-primary-foreground: var(--background-50);
  --sidebar-accent: var(--background-300);
  --sidebar-accent-foreground: var(--text-800);
  --sidebar-border: var(--background-300);
  --sidebar-ring: var(--brand-500);

  /* TYPOGRAPHY */
  --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;
  --tracking-normal: 0em;

  /* RADIUS */
  --radius: 1.2rem;

  /* SHADOWS */
  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.04); /* Hairline */
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04); /* Subtle */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05), 0 1px 3px -1px rgba(0, 0, 0, 0.05); /* Card */
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.05); /* Raised */
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.05); /* Card Hover */
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.08), 0 4px 8px -4px rgba(0, 0, 0, 0.05); /* Float */
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.10), 0 8px 16px -8px rgba(0, 0, 0, 0.06); /* Overlay */
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.12); /* Modal */

  /* SPACING */
  --spacing: 0.24rem;
}

/* ===== SEMANTIC ROLES - dark (primitive palette inherited) ===== */
.dark {
  --background: var(--background-900);
  --foreground: var(--text-50);
  --card: var(--background-800);
  --card-foreground: var(--text-50);
  --popover: var(--background-700);
  --popover-foreground: var(--text-50);

  --primary: var(--brand-400);
  --primary-foreground: var(--background-900);
  --secondary: var(--background-800);
  --secondary-foreground: var(--text-50);
  --muted: var(--background-800);
  --muted-foreground: var(--text-400);
  --accent: var(--background-700);
  --accent-foreground: var(--text-50);
  --destructive: var(--state-error-dark);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success-dark);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-700);
  --input: var(--background-700);
  --ring: var(--brand-400);

  --icon: var(--icon-50);
  --icon-muted: var(--icon-500);

  --chart-1: var(--state-success-dark);
  --chart-2: var(--brand-400);
  --chart-3: #ff9f0a;
  --chart-4: #5e5ce6;
  --chart-5: #bf5af2;

  --sidebar: var(--background-800);
  --sidebar-foreground: var(--text-50);
  --sidebar-primary: var(--brand-400);
  --sidebar-primary-foreground: var(--background-900);
  --sidebar-accent: var(--background-700);
  --sidebar-accent-foreground: var(--text-50);
  --sidebar-border: var(--background-700);
  --sidebar-ring: var(--brand-400);

  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.30);
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.30);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.36), 0 1px 3px -1px rgba(0, 0, 0, 0.36);
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.40), 0 1px 2px -1px rgba(0, 0, 0, 0.36);
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.44), 0 2px 4px -2px rgba(0, 0, 0, 0.36);
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.50), 0 4px 8px -4px rgba(0, 0, 0, 0.40);
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.55), 0 8px 16px -8px rgba(0, 0, 0, 0.44);
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.60);
}

/* radius semantic bridge - derived from Library --radius (1.2rem = 19.2px) */:root {
  --apple-radius-sm: calc(var(--radius) * 0.42);
  --apple-radius-md: calc(var(--radius) * 0.75);
  --apple-radius-lg: var(--radius);
}

      .app-tabbar { position: sticky; bottom: 0; height: 48px; background: rgba(255, 255, 255, .92); border-top: 1px solid var(--apple-border); display: flex; }
      .app-tabbar-inner { display: flex; width: 100%; }
      .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: transparent; border: 0; color: var(--apple-muted-foreground); min-height: 44px; cursor: pointer; transition: color .15s; }
      .tab-item[data-active="true"] { color: var(--apple-primary); }
      .tab-icon { width: 20px; height: 20px; }
      .tab-label { font-size: 10px; line-height: 1; }
      .peel-btn { position: fixed; right: 14px; bottom: 64px; width: 38px; height: 38px; border-radius: 999px; background: var(--apple-card); border: 1px solid var(--apple-border); box-shadow: var(--shadow-md); display: flex; align-items: center; justify-content: center; color: var(--apple-muted-foreground); cursor: pointer; transition: transform .15s, color .15s; }
      .peel-btn i { width: 18px; height: 18px; }

      /* ===== Page header ===== */
      .header-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .header-title { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.25; color: var(--apple-foreground); }
      .header-sub { margin: 0; font-size: 11px; line-height: 1.3; color: var(--apple-muted-foreground); }
      .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

      /* ===== Board card ===== */
      .board-card { flex: 1; min-height: 380px; display: flex; flex-direction: column; gap: 10px; padding: 12px; background: var(--apple-card); border: 1px solid var(--apple-border); border-radius: var(--apple-radius-lg); box-shadow: var(--shadow-xs); position: relative; }
      .board-head { display: flex; align-items: center; justify-content: space-between; }
      .board-head-label { font-size: 11px; color: var(--apple-muted-foreground); }
      .board-count { font-size: 10.5px; color: var(--apple-muted-foreground); }
      .board-editor { flex: 1; width: 100%; min-height: 0; border: 0; outline: 0; background: transparent; color: var(--apple-card-foreground); font: inherit; font-size: 12px; line-height: 1.7; resize: none; white-space: pre-wrap; overflow-wrap: break-word; word-break: break-word; }
      .board-editor::placeholder { color: var(--apple-muted-foreground); }
      .board-foot { display: flex; align-items: center; justify-content: space-between; font-size: 10px; color: var(--apple-muted-foreground); }

      /* ===== Empty-state placeholder ===== */
      .board-empty { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 12px; border: 1px solid var(--apple-border); border-radius: var(--apple-radius-md); background: transparent; font-size: 11px; color: var(--apple-muted-foreground); }
      .board-empty-icon { width: 14px; height: 14px; }
    </style>
    <style id="page-styles">
      .btn-clear, .btn-copy { display: inline-flex; align-items: center; justify-content: center; gap: 4px; height: 30px; border-radius: 999px; font-size: 11.5px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background-color .15s ease, color .15s ease, filter .15s ease, transform .15s ease; }
      .btn-clear { background: transparent; border: 0; padding: 0 6px; color: var(--apple-muted-foreground); }
      .btn-copy { background: var(--apple-primary); border: 0; padding: 0 12px; color: var(--apple-primary-foreground); }
      .btn-copy.is-copied { background: var(--state-success); }
      .btn-clear:active, .btn-copy:active { transform: scale(.97); }
      .btn-clear:focus-visible, .btn-copy:focus-visible, .peel-btn:focus-visible, .tab-item:focus-visible, .board-editor:focus-visible { outline: 2px solid var(--apple-ring); outline-offset: 2px; }
      .icon-13 { width: 13px; height: 13px; }
      .clear-hint { position: absolute; top: 38px; left: 50%; transform: translate(-50%, -3px); background: var(--apple-muted); color: var(--apple-muted-foreground); border-radius: var(--apple-radius-sm); font-size: 10.5px; line-height: 1; padding: 6px 10px; opacity: 0; pointer-events: none; z-index: 2; transition: opacity .15s ease, transform .15s cubic-bezier(.32, .72, 0, 1); }
      .clear-hint.show { opacity: 1; transform: translate(-50%, 0); }
      .board-editor.is-cleared { opacity: .45; transition: opacity .15s ease; }
      .copy-toast { position: fixed; bottom: 64px; left: 50%; transform: translate(-50%, 6px); background: var(--apple-foreground); color: var(--apple-background); font-size: 11px; line-height: 1; border-radius: 999px; padding: 6px 12px; opacity: 0; pointer-events: none; z-index: 5; transition: opacity .2s ease, transform .2s cubic-bezier(.32, .72, 0, 1); }
      .copy-toast.show { opacity: 1; transform: translate(-50%, 0); }
      /* ===== 桌面 hover：仅指针设备生效 ===== */
      @media (hover: hover) and (pointer: fine) {
        .peel-btn:hover { color: var(--apple-foreground); transform: scale(1.06); }
        .btn-clear:hover { color: var(--apple-destructive); }
        .btn-copy:hover { filter: brightness(.96); }
        .tab-item:hover { color: var(--apple-foreground); }
      }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; } }
    </style>

    <div class="app-frame" id="app-frame">
      <header class="app-header">
        <div class="header-left">
          <h1 class="header-title">自由白板</h1>
          <p class="header-sub">随时记录 · 自动保存</p>
        </div>
        <div class="header-actions">
          <button class="btn-clear" type="button"><i data-lucide="trash-2" class="icon-13"></i>清空</button>
          <button class="btn-copy" type="button"><i data-lucide="copy" class="icon-13"></i><span class="copy-label">复制全部</span></button>
        </div>
      </header>

      <div class="app-content">
        <div class="board-card">
          <div class="board-head">
            <span class="board-head-label">白板内容</span>
            <span class="board-count">128 字</span>
          </div>
          <div class="clear-hint" role="status">已清空 · 可撤销</div>
          <textarea class="board-editor" aria-label="白板编辑区" spellcheck="false">本周跟进：王永强 08/12 出货 6 款料；林氏电子 LD-5521 待确认价格；周五前整理 Q3 报价汇总表。快捷复制：Ctrl+Enter 复制全部。</textarea>
          <div class="board-foot">
            <span>输入时自动保存</span>
            <span>最近保存 10:42</span>
          </div>
        </div>
        <div class="board-empty" aria-hidden="false">
          <i data-lucide="sticky-note" class="board-empty-icon"></i>
          <span>空白时保持安静 · 输入即自动保存</span>
        </div>
      </div>

      <footer class="app-footer">白板内容保存在本机</footer>

      <nav class="app-tabbar" aria-label="主导航"><div class="app-tabbar-inner"><button class="tab-item" data-tab-key="clipboard" data-active="true" type="button"><i data-lucide="clipboard" class="tab-icon"></i><span class="tab-label">剪切板</span></button><button class="tab-item" data-tab-key="email" data-active="false" type="button"><i data-lucide="mail" class="tab-icon"></i><span class="tab-label">邮件</span></button><button class="tab-item" data-tab-key="notes" data-active="false" type="button"><i data-lucide="sticky-note" class="tab-icon"></i><span class="tab-label">便签</span></button><button class="tab-item" data-tab-key="settings" data-active="false" type="button"><i data-lucide="settings" class="tab-icon"></i><span class="tab-label">设置</span></button></div></nav>

      <button class="peel-btn" type="button" aria-label="收起面板" title="收起面板"><i data-lucide="chevron-up"></i></button>
      <div class="copy-toast" role="status">已复制全部内容</div>
    </div>

    <script>
      (function () {
        'use strict';
        var clearBtn = document.querySelector('.btn-clear');
        var copyBtn = document.querySelector('.btn-copy');
        var copyLabel = document.querySelector('.copy-label');
        var boardEditor = document.querySelector('.board-editor');
        var clearHint = document.querySelector('.clear-hint');
        var copyToast = document.querySelector('.copy-toast');
        var clearTimer = null, copyTimer = null, toastTimer = null;

        function copyAll() {
          window.clearTimeout(copyTimer);
          window.clearTimeout(toastTimer);
          copyLabel.textContent = '已复制';
          copyBtn.classList.add('is-copied');
          copyToast.classList.add('show');
          copyTimer = window.setTimeout(function () {
            copyLabel.textContent = '复制全部';
            copyBtn.classList.remove('is-copied');
          }, 1600);
          toastTimer = window.setTimeout(function () {
            copyToast.classList.remove('show');
          }, 1600);
        }

        clearBtn.addEventListener('click', function () {
          boardEditor.classList.add('is-cleared');
          clearHint.classList.add('show');
          window.clearTimeout(clearTimer);
          clearTimer = window.setTimeout(function () {
            boardEditor.classList.remove('is-cleared');
            clearHint.classList.remove('show');
          }, 2000);
        });

        copyBtn.addEventListener('click', copyAll);

        boardEditor.addEventListener('keydown', function (e) {
          if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            e.preventDefault();
            copyAll();
          }
        });
      })();
    </script>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
