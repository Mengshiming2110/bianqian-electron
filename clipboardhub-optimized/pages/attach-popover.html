/*
 * Pinguo design tokens
 * Brand: Pinguo
 * Domain: Consumer imaging product
 * Style: Restrained, elegant, Apple-inspired
 * Theme mode: light-dark
 * Source language: zh
 * Output language: en
 *
 * Color architecture (two layers):
 *   1. Primitive palette - six categories. brand / background / text / icon
 *      are each a 10-step scale (50 lightest to 900 darkest). state-success and
 *      state-error are functional colors anchored on Apple system colors.
 *      Anchors follow Apple Human Interface Guidelines system colors
 *      (System Blue #007AFF, System Green #34C759, System Red #FF3B30,
 *      system grays / label / background colors).
 *   2. Semantic tokens - :root (light) and .dark map roles onto primitives.
 *      Components and UI kits must only consume the semantic tokens below.
 */

/* @group-priority: brand, background, text, icon, state-success, state-error */

:root {
  
  /* solo-design consumption aliases: explicit prefix for fill-html-head.mjs */
  --apple-background: var(--background, #ffffff);
  --apple-foreground: var(--foreground, #0f172a);
  --apple-card: var(--card, var(--background));
  --apple-card-foreground: var(--card-foreground, var(--foreground));
  --apple-popover: var(--popover, var(--card));
  --apple-popover-foreground: var(--popover-foreground, var(--card-foreground, var(--foreground)));
  --apple-primary: var(--primary, #111827);
  --apple-primary-foreground: var(--primary-foreground, #ffffff);
  --apple-secondary: var(--secondary, var(--muted, var(--card)));
  --apple-secondary-foreground: var(--secondary-foreground, var(--foreground));
  --apple-muted: var(--muted, var(--card));
  --apple-muted-foreground: var(--muted-foreground, var(--foreground));
  --apple-accent: var(--accent, var(--secondary, var(--muted, var(--card))));
  --apple-accent-foreground: var(--accent-foreground, var(--foreground));
  --apple-destructive: var(--destructive, #ef4444);
  --apple-destructive-foreground: var(--destructive-foreground, #ffffff);
  --apple-border: var(--border, currentColor);
  --apple-input: var(--input, var(--border));
  --apple-ring: var(--ring, var(--primary));
  --apple-chart-1: var(--chart-1, var(--primary));
  --apple-chart-2: var(--chart-2, var(--secondary, var(--primary)));
  --apple-chart-3: var(--chart-3, var(--accent, var(--primary)));
  --apple-chart-4: var(--chart-4, var(--muted-foreground, var(--foreground)));
  --apple-chart-5: var(--chart-5, var(--foreground));
  --apple-sidebar: var(--sidebar, var(--background));
  --apple-sidebar-foreground: var(--sidebar-foreground, var(--foreground));
  --apple-sidebar-primary: var(--sidebar-primary, var(--primary));
  --apple-sidebar-primary-foreground: var(--sidebar-primary-foreground, var(--primary-foreground));
  --apple-sidebar-accent: var(--sidebar-accent, var(--accent, var(--muted, var(--card))));
  --apple-sidebar-accent-foreground: var(--sidebar-accent-foreground, var(--accent-foreground, var(--foreground)));

/* ===== PRIMITIVE PALETTE ===== */

  /* brand */
  --brand-50: #e8f2ff;
  --brand-100: #cfe5ff;
  --brand-200: #9fcbff;
  --brand-300: #66abff;
  --brand-400: #2e8dff;
  --brand-500: #007aff; /* @primary */
  --brand-600: #0064d6;
  --brand-700: #004fad;
  --brand-800: #003b82;
  --brand-900: #00275a;

  /* background */
  --background-50: #ffffff;
  --background-100: #f7f7fa;
  --background-200: #f2f2f7;
  --background-300: #e5e5ea;
  --background-400: #d1d1d6;
  --background-500: #aeaeb2;
  --background-600: #8e8e93;
  --background-700: #3a3a3c;
  --background-800: #1c1c1e;
  --background-900: #000000;

  /* text */
  --text-50: #f5f5f7;
  --text-100: #e3e3e8;
  --text-200: #c7c7cc;
  --text-300: #aeaeb2;
  --text-400: #8e8e93;
  --text-500: #6e6e73;
  --text-600: #48484a;
  --text-700: #3c3c43;
  --text-800: #1d1d1f;
  --text-900: #000000;

  /* icon */
  --icon-50: #f5f5f7;
  --icon-100: #e5e5ea;
  --icon-200: #d1d1d6;
  --icon-300: #c7c7cc;
  --icon-400: #aeaeb2;
  --icon-500: #8e8e93;
  --icon-600: #6e6e73;
  --icon-700: #48484a;
  --icon-800: #2c2c2e;
  --icon-900: #1d1d1f;

  /* state-success */
  --state-success: #34c759; /* @primary */
  --state-success-dark: #30d158;
  --state-success-surface: #e9f9ee;
  --state-success-foreground: #ffffff;

  /* state-error */
  --state-error: #ff3b30; /* @primary */
  --state-error-dark: #ff453a;
  --state-error-surface: #ffecea;
  --state-error-foreground: #ffffff;

  /* ===== SEMANTIC ROLES ===== */

  /* semantic */
  --background: var(--background-50);
  --foreground: var(--text-800);
  --card: var(--background-50);
  --card-foreground: var(--text-800);
  --popover: var(--background-50);
  --popover-foreground: var(--text-900);

  --primary: var(--brand-500);
  --primary-foreground: var(--background-50);
  --secondary: var(--background-200);
  --secondary-foreground: var(--text-800);
  --muted: var(--background-200);
  --muted-foreground: var(--text-400);
  --accent: var(--background-100);
  --accent-foreground: var(--text-800);
  --destructive: var(--state-error);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-300);
  --input: var(--background-400);
  --ring: var(--brand-500);

  --icon: var(--icon-900);
  --icon-muted: var(--icon-500);

  /* chart */
  --chart-1: var(--state-success);
  --chart-2: var(--brand-500);
  --chart-3: #ff9500;
  --chart-4: #5856d6;
  --chart-5: #af52de;

  /* sidebar */
  --sidebar: var(--background-200);
  --sidebar-foreground: var(--text-800);
  --sidebar-primary: var(--brand-500);
  --sidebar-primary-foreground: var(--background-50);
  --sidebar-accent: var(--background-300);
  --sidebar-accent-foreground: var(--text-800);
  --sidebar-border: var(--background-300);
  --sidebar-ring: var(--brand-500);

  /* TYPOGRAPHY */
  --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;
  --tracking-normal: 0em;

  /* RADIUS */
  --radius: 1.2rem;

  /* SHADOWS */
  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.04); /* Hairline */
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04); /* Subtle */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05), 0 1px 3px -1px rgba(0, 0, 0, 0.05); /* Card */
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.05); /* Raised */
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.05); /* Card Hover */
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.08), 0 4px 8px -4px rgba(0, 0, 0, 0.05); /* Float */
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.10), 0 8px 16px -8px rgba(0, 0, 0, 0.06); /* Overlay */
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.12); /* Modal */

  /* SPACING */
  --spacing: 0.24rem;
}

/* ===== SEMANTIC ROLES - dark (primitive palette inherited) ===== */
.dark {
  --background: var(--background-900);
  --foreground: var(--text-50);
  --card: var(--background-800);
  --card-foreground: var(--text-50);
  --popover: var(--background-700);
  --popover-foreground: var(--text-50);

  --primary: var(--brand-400);
  --primary-foreground: var(--background-900);
  --secondary: var(--background-800);
  --secondary-foreground: var(--text-50);
  --muted: var(--background-800);
  --muted-foreground: var(--text-400);
  --accent: var(--background-700);
  --accent-foreground: var(--text-50);
  --destructive: var(--state-error-dark);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success-dark);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-700);
  --input: var(--background-700);
  --ring: var(--brand-400);

  --icon: var(--icon-50);
  --icon-muted: var(--icon-500);

  --chart-1: var(--state-success-dark);
  --chart-2: var(--brand-400);
  --chart-3: #ff9f0a;
  --chart-4: #5e5ce6;
  --chart-5: #bf5af2;

  --sidebar: var(--background-800);
  --sidebar-foreground: var(--text-50);
  --sidebar-primary: var(--brand-400);
  --sidebar-primary-foreground: var(--background-900);
  --sidebar-accent: var(--background-700);
  --sidebar-accent-foreground: var(--text-50);
  --sidebar-border: var(--background-700);
  --sidebar-ring: var(--brand-400);

  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.30);
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.30);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.36), 0 1px 3px -1px rgba(0, 0, 0, 0.36);
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.40), 0 1px 2px -1px rgba(0, 0, 0, 0.36);
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.44), 0 2px 4px -2px rgba(0, 0, 0, 0.36);
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.50), 0 4px 8px -4px rgba(0, 0, 0, 0.40);
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.55), 0 8px 16px -8px rgba(0, 0, 0, 0.44);
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.60);
}

/* radius semantic bridge - derived from Library --radius (1.2rem = 19.2px) */:root {
  --apple-radius-sm: calc(var(--radius) * 0.42);
  --apple-radius-md: calc(var(--radius) * 0.75);
  --apple-radius-lg: var(--radius);
}

    <style id="critical-layout">
      /* ===== 无运行时稳定性：壳层、便签卡、附件弹层、底部标签栏 ===== */
      body{margin:0;background:var(--apple-background);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
      .app-frame{width:400px;min-height:640px;margin-inline:auto;background:var(--apple-background);box-shadow:var(--shadow-lg);display:flex;flex-direction:column}
      .app-header{padding:14px 16px 10px}
      .app-content{flex:1;padding:0 16px 96px;min-width:0}
      .app-tabbar{position:sticky;bottom:0;height:48px;background:var(--apple-card);backdrop-filter:blur(12px);border-top:1px solid var(--apple-border);display:flex}
      .app-tabbar-inner{display:flex;width:100%}
      .tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:transparent;border:0;color:var(--apple-muted-foreground);min-height:44px;cursor:pointer;transition:color .15s}
      .tab-item[data-active="true"]{color:var(--apple-primary)}
      .tab-icon{width:20px;height:20px}
      .tab-label{font-size:10px;line-height:1}

      /* 页头 */
      .header-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
      .page-title{margin:0;font-size:16px;font-weight:600;line-height:1.25;color:var(--apple-foreground)}
      .page-subtitle{margin:2px 0 0;font-size:11px;color:var(--apple-muted-foreground)}

      /* 便签卡 */
      .notes-section{margin-top:4px}
      .note-card-wrap{position:relative}
      .note-card{padding:12px;background:var(--apple-card);border:1px solid var(--apple-border);border-radius:var(--apple-radius-md);box-shadow:var(--shadow-sm)}
      .note-title{margin:0;font-size:13px;font-weight:600;line-height:1.35;color:var(--apple-foreground)}
      .note-preview{margin:6px 0 0;font-size:12px;line-height:1.55;color:var(--apple-muted-foreground);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
      .note-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
      .note-tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;background:var(--apple-accent);color:var(--apple-muted-foreground);font-size:10px;line-height:1.5}
      .attach-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;background:var(--apple-accent);border:1px solid transparent;color:var(--apple-foreground);font-size:11px;font-weight:600;cursor:pointer;min-height:24px}
      .attach-pill svg{width:12px;height:12px}

      /* 附件弹层 */
      .popover-wrap{position:absolute;top:calc(100% + 6px);right:0;width:186px;z-index:10}
      .attach-popover{background:var(--apple-popover);border:1px solid var(--apple-border);border-radius:12px;box-shadow:var(--shadow-xl);overflow:hidden;display:flex;flex-direction:column;transform-origin:top right;animation:pop-in 180ms cubic-bezier(.32,.72,0,1) both}
      @keyframes pop-in{from{opacity:0;transform:translateY(4px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
      .popover-header{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:var(--apple-accent);border-bottom:1px solid var(--apple-border)}
      .popover-title{font-size:11px;font-weight:600;line-height:1;color:var(--apple-primary)}
      .popover-close{display:flex;align-items:center;justify-content:center;width:22px;height:22px;padding:0;border:0;border-radius:var(--apple-radius-sm);background:transparent;color:var(--apple-muted-foreground);cursor:pointer}
      .popover-close svg{width:12px;height:12px}
      .popover-files{padding:6px 8px 2px;display:flex;flex-direction:column;gap:2px}
      .popover-file-row{display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:var(--apple-radius-sm);font-size:12px}
      .file-icon{width:13px;height:13px;color:var(--apple-muted-foreground);flex:none}
      .file-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--apple-foreground)}
      .file-remove{display:flex;align-items:center;justify-content:center;width:20px;height:20px;padding:0;border:0;border-radius:var(--apple-radius-sm);background:transparent;color:var(--apple-muted-foreground);cursor:pointer;flex:none}
      .file-remove svg{width:11px;height:11px}
      .popover-footer{padding:6px 8px 8px;margin-top:4px;border-top:1px solid var(--apple-border)}
      .popover-add-btn{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;padding:7px 0;border:0;border-radius:999px;background:var(--apple-accent);color:var(--apple-primary);font-size:11px;font-weight:600;cursor:pointer}
      .popover-add-btn svg{width:13px;height:13px}
      .popover-hint{margin:6px 0 0;text-align:center;font-size:10px;color:var(--apple-muted-foreground)}
      .is-hidden{display:none}

      /* footer */
      .app-footer{padding:4px 16px 10px;text-align:center;font-size:10px;color:var(--apple-muted-foreground)}
    </style>
    <style id="page-styles">
      /* ===== 交互增强与动效（运行时仅做增强） ===== */
      .attach-pill{transition:background-color .15s cubic-bezier(.32,.72,0,1),border-color .15s cubic-bezier(.32,.72,0,1),color .15s,transform .15s cubic-bezier(.32,.72,0,1)}
      .attach-pill[data-active="true"]{background:var(--apple-primary);border-color:var(--apple-primary);color:var(--apple-primary-foreground)}
      .attach-pill:active{transform:scale(.96)}
      .popover-close,.file-remove{transition:background-color .15s,color .15s,opacity .15s}
      .file-remove{opacity:0}
      .popover-file-row:focus-within .file-remove{opacity:1}
      .file-name{transition:color .15s}
      .popover-add-btn{transition:background-color .15s,color .15s}
      .attach-popover.is-closing{animation:pop-out 150ms cubic-bezier(.32,.72,0,1) both}
      @keyframes pop-out{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(4px) scale(.98)}}
      .note-card{transition:border-color .15s cubic-bezier(.32,.72,0,1),box-shadow .15s cubic-bezier(.32,.72,0,1),transform .15s cubic-bezier(.32,.72,0,1)}
      .popover-close:focus-visible,.attach-pill:focus-visible,.file-remove:focus-visible,.popover-add-btn:focus-visible,.tab-item:focus-visible{outline:2px solid var(--apple-ring);outline-offset:2px}
      @media (hover: hover) and (pointer: fine) {
        .attach-pill:not([data-active="true"]):hover{background:var(--apple-muted);border-color:var(--apple-ring)}
        .note-card:hover{border-color:var(--apple-accent);box-shadow:var(--shadow-sm);transform:translateY(-1px)}
        .popover-file-row:hover .file-remove{opacity:1}
        .popover-close:hover{background:var(--apple-secondary);color:var(--apple-foreground)}
        .file-remove:hover{background:var(--apple-accent);color:var(--apple-destructive)}
        .file-name:hover{color:var(--apple-primary)}
        .popover-add-btn:hover{background:var(--apple-primary);color:var(--apple-primary-foreground)}
        .tab-item:hover{color:var(--apple-foreground)}
        .tab-item[data-active="true"]:hover{color:var(--apple-primary)}
      }
      @media (prefers-reduced-motion: reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
    </style>
    <div class="app-frame" id="app-frame">

    <script>
      (function () {
        var pill = document.getElementById('attach-pill');
        var wrap = document.getElementById('popover-wrap');
        var popover = document.getElementById('attach-popover');
        var closeBtn = document.getElementById('popover-close');
        var timer = null;
        function setOpen(open) {
          if (timer) { clearTimeout(timer); timer = null; }
          if (open) {
            popover.classList.remove('is-closing');
            wrap.classList.remove('is-hidden');
            pill.setAttribute('data-active', 'true');
            pill.setAttribute('aria-expanded', 'true');
          } else {
            popover.classList.add('is-closing');
            timer = setTimeout(function () {
              wrap.classList.add('is-hidden');
              popover.classList.remove('is-closing');
            }, 150);
            pill.setAttribute('data-active', 'false');
            pill.setAttribute('aria-expanded', 'false');
          }
        }
        pill.addEventListener('click', function () {
          setOpen(wrap.classList.contains('is-hidden'));
        });
        closeBtn.addEventListener('click', function () { setOpen(false); });
      })();
    </script>
