<!DOCTYPE html>
<html><body>
<canvas id="c256" width="256" height="256"></canvas>
<canvas id="c32" width="32" height="32"></canvas>
<canvas id="c16" width="16" height="16"></canvas>
<script>
function drawIcon(canvas) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const scale = w / 256;

  // Background rounded rect
  const bgR = 48 * scale;
  ctx.beginPath();
  ctx.moveTo(16 * scale + bgR, 16 * scale);
  ctx.lineTo(240 * scale - bgR, 16 * scale);
  ctx.arcTo(240 * scale, 16 * scale, 240 * scale, 16 * scale + bgR, bgR);
  ctx.lineTo(240 * scale, 240 * scale - bgR);
  ctx.arcTo(240 * scale, 240 * scale, 240 * scale - bgR, 240 * scale, bgR);
  ctx.lineTo(16 * scale + bgR, 240 * scale);
  ctx.arcTo(16 * scale, 240 * scale, 16 * scale, 240 * scale - bgR, bgR);
  ctx.lineTo(16 * scale, 16 * scale + bgR);
  ctx.arcTo(16 * scale, 16 * scale, 16 * scale + bgR, 16 * scale, bgR);
  ctx.closePath();
  ctx.fillStyle = '#2f7d78';
  ctx.fill();

  // White page
  const pageR = 12 * scale;
  ctx.beginPath();
  ctx.moveTo(52 * scale + pageR, 44 * scale);
  ctx.lineTo(196 * scale - pageR, 44 * scale);
  ctx.arcTo(204 * scale, 44 * scale, 204 * scale, 44 * scale + pageR, pageR);
  ctx.lineTo(204 * scale, 212 * scale - pageR);
  ctx.arcTo(204 * scale, 224 * scale, 204 * scale - pageR, 224 * scale, pageR);
  ctx.lineTo(52 * scale + pageR, 224 * scale);
  ctx.arcTo(52 * scale, 224 * scale, 52 * scale, 224 * scale - pageR, pageR);
  ctx.lineTo(52 * scale, 44 * scale + pageR);
  ctx.arcTo(52 * scale, 44 * scale, 52 * scale + pageR, 44 * scale, pageR);
  ctx.closePath();
  ctx.fillStyle = '#fff';
  ctx.fill();

  // Lines
  const lw = Math.max(1, 3 * scale);
  ctx.strokeStyle = 'rgba(47,125,120,0.25)';
  ctx.lineWidth = lw;
  ctx.lineCap = 'round';
  const drawLine = (x1, y1, x2, y2) => { ctx.beginPath(); ctx.moveTo(x1 * scale, y1 * scale); ctx.lineTo(x2 * scale, y2 * scale); ctx.stroke(); };
  drawLine(78, 90, 178, 90);
  drawLine(78, 118, 178, 118);
  drawLine(78, 146, 160, 146);

  // Accent tab
  ctx.fillStyle = '#2f7d78';
  ctx.beginPath();
  ctx.moveTo(52 * scale, 44 * scale);
  ctx.lineTo(58 * scale, 44 * scale);
  ctx.lineTo(58 * scale, 84 * scale);
  ctx.arcTo(58 * scale, 88 * scale, 54 * scale, 88 * scale, 3 * scale);
  ctx.lineTo(54 * scale, 88 * scale);
  ctx.arcTo(52 * scale, 88 * scale, 52 * scale, 84 * scale, 3 * scale);
  ctx.closePath();
  ctx.fill();
}

// Draw and trigger download for each size
[['c256', 'icon.png'], ['c32', 'tray-icon.png'], ['c16', 'tray-icon-16.png']].forEach(([id, name]) => {
  drawIcon(document.getElementById(id));
  const link = document.createElement('a');
  link.download = name;
  link.href = document.getElementById(id).toDataURL('image/png');
  document.body.appendChild(link);
  link.click();
});
document.title = 'Icons generated - check downloads';
</script>
</body></html>
