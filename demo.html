<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>便签 Bianqian — 功能演示 Demo</title>
<style>
/* ===== CSS Variables — 双主题 ===== */
:root, [data-theme="light"] {
  --bg-window: rgba(255,255,255,0.92);
  --bg-card: #f5f5f5;
  --bg-card-hover: #eae7e2;
  --bg-input: #fff;
  --bg-elevated: #fff;
  --bg-overlay: rgba(0,0,0,0.35);
  --text: #1a1a1a;
  --text-muted: #888;
  --border: rgba(0,0,0,0.08);
  --accent: #2F7D78;
  --accent-strong: #1a5c58;
  --accent-soft: rgba(47,125,120,0.1);
  --danger: #e5484d;
  --radius-window: 18px;
  --radius-panel: 16px;
  --radius-control: 10px;
  --radius-small: 6px;
  --shadow: 0 12px 40px rgba(0,0,0,0.15), 0 0 0 1px rgba(0,0,0,0.06);
  --shadow-drag: 0 16px 48px rgba(0,0,0,0.22);
}

[data-theme="dark"] {
  --bg-window: rgba(28,28,30,0.92);
  --bg-card: #2c2c2e;
  --bg-card-hover: #38383a;
  --bg-input: #1c1c1e;
  --bg-elevated: #2c2c2e;
  --bg-overlay: rgba(0,0,0,0.55);
  --text: #e5e5e5;
  --text-muted: #98989d;
  --border: rgba(255,255,255,0.08);
  --accent: #4ea8a0;
  --accent-strong: #6fc5bc;
  --accent-soft: rgba(78,168,160,0.12);
  --danger: #f87171;
  --shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.06);
  --shadow-drag: 0 16px 48px rgba(0,0,0,0.55);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  font-size: 13px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 40px;
  transition: background 0.4s;
}
[data-theme="dark"] body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); }

.demo-container {
  display: flex; gap: 40px; align-items: flex-start; flex-wrap: wrap; justify-content: center;
}

/* ===== App Shell ===== */
.app-shell {
  width: 280px;
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr) auto;
  border: 1px solid var(--border);
  border-radius: var(--radius-window);
  background: var(--bg-window);
  box-shadow: var(--shadow);
  backdrop-filter: blur(18px);
  clip-path: inset(0 round var(--radius-window));
  overflow: hidden;
  max-height: 600px;
  transition: all 0.35s ease;
}

.app-shell.mini-mode {
  grid-template-rows: auto auto;
}

/* ===== Header ===== */
.app-header {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 14px 14px 10px;
  -webkit-app-region: drag;
}
.eyebrow { color: var(--accent); font-size: 12px; font-weight: 700; margin-bottom: 2px; }
.app-header h1 { font-size: 22px; line-height: 1.1; color: var(--text); }
.header-actions { display: flex; gap: 6px; -webkit-app-region: no-drag; }
.icon-btn {
  display: inline-grid; width: 32px; height: 32px; place-items: center;
  border-radius: var(--radius-control); color: var(--text); background: var(--bg-card);
  border: none; cursor: pointer; font-size: 16px; transition: all 0.15s;
}
.icon-btn:hover { color: var(--accent-strong); background: var(--accent-soft); }
.icon-btn.active { color: #fff; background: var(--accent); }

/* ===== Toolbar ===== */
.toolbar { padding: 0 12px 10px; }
.search-box {
  display: flex; align-items: center; gap: 8px; height: 34px;
  padding: 0 10px; border: 1px solid var(--border); border-radius: var(--radius-control);
  color: var(--text-muted); background: var(--bg-card);
}
.search-box input {
  width: 100%; border: 0; outline: 0; background: transparent;
  font-size: 13px; color: var(--text);
}
.search-box input::placeholder { color: var(--text-muted); opacity: 0.6; font-size: 12px; }

/* ===== Note List ===== */
.note-list {
  display: flex; flex-direction: column; gap: 8px;
  min-height: 0; overflow-y: auto; padding: 0 12px 10px;
  max-height: 400px;
}
.note-list::-webkit-scrollbar { width: 3px; }
.note-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.note-card {
  flex: 0 0 auto; padding: 10px;
  border: 1px solid var(--border); border-radius: var(--radius-control);
  background: var(--bg-card); cursor: pointer; user-select: none;
  transition: all 0.18s ease;
  position: relative;
}
.note-card:hover { border-color: rgba(47,125,120,0.52); background: var(--bg-card-hover); }
.note-card.completed { opacity: 0.56; }
.note-card.completed .card-title::after {
  content: ''; position: absolute; left: 0; top: calc(50% - 0.75px);
  width: 100%; height: 1.5px; background: currentColor;
  transform: scaleX(1); transform-origin: left center;
}

/* Color bars */
.note-card.color-red { border-left: 3px solid #ef4444; }
.note-card.color-orange { border-left: 3px solid #f97316; }
.note-card.color-yellow { border-left: 3px solid #eab308; }
.note-card.color-green { border-left: 3px solid #22c55e; }
.note-card.color-blue { border-left: 3px solid #3b82f6; }
.note-card.color-purple { border-left: 3px solid #a855f7; }

.card-row { display: flex; align-items: center; }
.card-top { gap: 7px; }
.card-top .card-title {
  min-width: 0; flex: 1; overflow: hidden; font-size: 14px; line-height: 20px;
  text-overflow: ellipsis; white-space: nowrap; color: var(--text); position: relative;
}
.card-top time { color: var(--text-muted); font-size: 12px; flex-shrink: 0; }
.check-btn {
  display: inline-grid; width: 22px; height: 22px; flex: 0 0 22px; place-items: center;
  border-radius: 999px; color: var(--accent); background: transparent;
  border: none; cursor: pointer; font-size: 16px;
}
.pin-btn {
  width: 20px; height: 20px; border-radius: 5px; color: var(--text-muted);
  background: transparent; border: none; cursor: pointer; font-size: 13px;
  display: flex; align-items: center; justify-content: center; opacity: 0;
}
.note-card:hover .pin-btn { opacity: 1; }
.pin-btn.pinned { opacity: 1; color: var(--accent-strong); background: var(--accent-soft); }

.note-preview {
  display: -webkit-box; margin: 6px 0 8px 29px; overflow: hidden;
  color: var(--text-muted); font-size: 12px; line-height: 17px;
  -webkit-box-orient: vertical; -webkit-line-clamp: 2;
}
.note-preview strong { color: var(--text); }
.note-preview em { opacity: 0.8; }

.card-meta { justify-content: space-between; gap: 8px; margin-left: 29px; }
.cat-pill {
  max-width: 76px; overflow: hidden; padding: 3px 8px;
  border-radius: var(--radius-small); color: var(--accent-strong);
  background: var(--accent-soft); font-size: 12px;
  text-overflow: ellipsis; white-space: nowrap;
}
.attach-pill {
  display: flex; align-items: center; gap: 3px; padding: 3px 8px;
  border-radius: 4px; color: var(--accent-strong); background: var(--accent-soft);
  font-size: 10px; cursor: pointer;
}

.empty-state {
  display: grid; min-height: 190px; place-items: center; align-content: center;
  gap: 8px; color: var(--text-muted);
}

/* ===== Footer ===== */
.app-footer {
  display: flex; justify-content: space-between; padding: 8px 14px 11px;
  color: var(--text-muted); font-size: 12px;
}

/* ===== Mini Mode ===== */
.app-shell.mini-mode .app-header { display: none; }
.app-shell.mini-mode .toolbar { display: none; }
.app-shell.mini-mode .app-footer { display: none; }
.mini-drag-bar { height: 18px; -webkit-app-region: drag; cursor: grab; display: none; }
.app-shell.mini-mode .mini-drag-bar { display: block; }
.app-shell.mini-mode .note-list { gap: 6px; padding: 0 10px 10px; }
.app-shell.mini-mode .note-card { padding: 8px; }
.app-shell.mini-mode .note-preview { margin: 3px 0 5px 29px; -webkit-line-clamp: unset; }
.app-shell.mini-mode .card-meta { display: none; }

/* ===== Editor Overlay ===== */
.editor-overlay {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding: 12px; background: var(--bg-overlay); z-index: 1000;
}
.editor-panel {
  display: grid; width: min(100%, 360px); max-height: calc(100vh - 24px);
  gap: 12px; overflow-y: auto; padding: 14px;
  border-radius: var(--radius-panel); background: var(--bg-elevated);
  box-shadow: var(--shadow);
}
.editor-header { display: flex; justify-content: space-between; align-items: center; }
.editor-header h2 { font-size: 17px; color: var(--text); }
.field { display: grid; gap: 6px; }
.field.full { grid-column: 1 / -1; }
.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field span { color: var(--text-muted); font-size: 12px; }
.field input, .field select, .field textarea {
  width: 100%; min-width: 0; border: 1px solid var(--border);
  border-radius: var(--radius-control); outline: 0; background: var(--bg-input);
  font-size: 13px; color: var(--text); padding: 0 10px; height: 34px;
  font-family: inherit;
}
.field textarea { min-height: 102px; resize: vertical; padding: 9px 10px; height: auto; }
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: rgba(47,125,120,0.56); box-shadow: 0 0 0 3px var(--accent-soft);
}
.color-dots { display: flex; gap: 6px; padding: 4px 0; }
.color-dot {
  width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent;
  cursor: pointer; transition: all 0.15s;
}
.color-dot:hover { transform: scale(1.15); }
.color-dot.sel { border-color: var(--accent); }
.color-dot.def { background: var(--border); }
.color-dot.red { background: #ef4444; }
.color-dot.orange { background: #f97316; }
.color-dot.yellow { background: #eab308; }
.color-dot.green { background: #22c55e; }
.color-dot.blue { background: #3b82f6; }
.color-dot.purple { background: #a855f7; }

.editor-actions {
  display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px;
}
.btn { justify-content: center; gap: 6px; min-height: 34px; padding: 0 12px;
  border-radius: var(--radius-control); font-size: 13px; cursor: pointer;
  border: none; font-family: inherit; display: flex; align-items: center;
}
.btn-secondary { border: 1px solid var(--border); color: var(--text); background: var(--bg-input); }
.btn-secondary:hover { background: var(--bg-card); }
.btn-primary { color: #fff; background: var(--accent); }
.btn-primary:hover { opacity: 0.9; }
.btn-danger { color: #fff; background: var(--danger); }
.btn-danger:hover { opacity: 0.9; }

/* ===== Sidebar — Controls ===== */
.control-panel {
  width: 280px; display: flex; flex-direction: column; gap: 14px;
  background: var(--bg-window); border-radius: var(--radius-panel);
  padding: 16px; box-shadow: var(--shadow); backdrop-filter: blur(18px);
}
.control-panel h3 { font-size: 15px; color: var(--text); }
.control-group { display: flex; flex-direction: column; gap: 6px; }
.control-group label { font-size: 12px; color: var(--text-muted); }
.control-row { display: flex; gap: 6px; flex-wrap: wrap; }
.control-btn {
  padding: 6px 12px; border: 1px solid var(--border); border-radius: var(--radius-control);
  color: var(--text-muted); background: var(--bg-input); font-size: 12px;
  cursor: pointer; font-family: inherit; transition: all 0.15s;
}
.control-btn:hover { border-color: var(--accent); color: var(--accent-strong); }
.control-btn.active { border-color: var(--accent); color: var(--accent-strong); background: var(--accent-soft); font-weight: 700; }
.control-btn.danger { color: var(--danger); border-color: var(--danger); }
.control-btn.danger:hover { background: var(--danger); color: #fff; }

input[type="range"] { width: 100%; accent-color: var(--accent); }
.badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px;
  border-radius: 999px; font-size: 10px; font-weight: 700;
}
.badge-pass { background: rgba(239,68,68,0.15); color: #ef4444; }
.badge-dock { background: rgba(59,130,246,0.15); color: #3b82f6; }

/* ===== Context Menu ===== */
.context-menu {
  position: fixed; z-index: 2000; min-width: 160px;
  background: var(--bg-elevated); border: 1px solid var(--border);
  border-radius: var(--radius-control); box-shadow: var(--shadow-drag);
  padding: 4px; display: none;
}
.context-menu.show { display: block; }
.context-item {
  display: flex; align-items: center; gap: 8px; padding: 7px 10px;
  border-radius: 6px; font-size: 13px; color: var(--text); cursor: pointer;
}
.context-item:hover { background: var(--accent-soft); }
.context-item.danger { color: var(--danger); }
.context-sep { height: 1px; background: var(--border); margin: 4px 0; }

/* ===== Feature Tags ===== */
.feature-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.feature-tag {
  padding: 2px 7px; border-radius: 999px; font-size: 10px; font-weight: 600;
  border: 1px solid;
}
.tag-theme { color: #8b5cf6; border-color: rgba(139,92,246,0.3); background: rgba(139,92,246,0.08); }
.tag-markdown { color: #06b6d4; border-color: rgba(6,182,212,0.3); background: rgba(6,182,212,0.08); }
.tag-drag { color: #f59e0b; border-color: rgba(245,158,11,0.3); background: rgba(245,158,11,0.08); }
.tag-nlp { color: #10b981; border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.08); }
.tag-anim { color: #ec4899; border-color: rgba(236,72,153,0.3); background: rgba(236,72,153,0.08); }
.tag-edge { color: #3b82f6; border-color: rgba(59,130,246,0.3); background: rgba(59,130,246,0.08); }
.tag-attach { color: #f97316; border-color: rgba(249,115,22,0.3); background: rgba(249,115,22,0.08); }

/* ===== Responsive ===== */
@media (max-width: 680px) {
  .demo-container { flex-direction: column; align-items: center; }
}

/* ===== Editor Modal ===== */
.hidden { display: none !important; }
</style>
</head>
<body>

<div class="demo-container">

  <!-- ====== APP SHELL ====== -->
  <div id="appShell" class="app-shell">
    <!-- Header -->
    <header class="app-header">
      <div>
        <p class="eyebrow" id="activeCatLabel">全部</p>
        <h1>便签</h1>
      </div>
      <div class="header-actions">
        <button class="icon-btn" title="切换主题" onclick="toggleTheme()">🌓</button>
        <button class="icon-btn" title="新建便签" onclick="openEditor()">＋</button>
        <button class="icon-btn" title="隐藏窗口">−</button>
      </div>
    </header>

    <div class="mini-drag-bar"></div>

    <!-- Search -->
    <section class="toolbar">
      <div class="search-box">
        <span style="font-size:15px">🔍</span>
        <input id="searchInput" type="search" placeholder="搜索，或输入：明天9点交报告 #工作" oninput="filterNotes()" onkeydown="if(event.key==='Enter')quickCreate(this.value)">
      </div>
    </section>

    <!-- Note List -->
    <section id="noteList" class="note-list" aria-label="便签列表"></section>

    <!-- Footer -->
    <footer class="app-footer">
      <span id="noteCount">5 条</span>
      <span id="todayLabel"></span>
    </footer>
  </div>

  <!-- ====== CONTROL PANEL ====== -->
  <div class="control-panel" id="controlPanel">
    <h3>🎛️ 功能演示面板</h3>

    <div class="feature-tags">
      <span class="feature-tag tag-theme">暗色/浅色</span>
      <span class="feature-tag tag-markdown">Markdown</span>
      <span class="feature-tag tag-drag">拖拽排序</span>
      <span class="feature-tag tag-nlp">NLP解析</span>
      <span class="feature-tag tag-anim">完成动画</span>
      <span class="feature-tag tag-edge">边缘吸附</span>
      <span class="feature-tag tag-attach">附件系统</span>
    </div>

    <div class="control-group">
      <label>📐 窗口模式</label>
      <div class="control-row">
        <button class="control-btn active" data-mode="normal" onclick="setMode('normal', this)">常规</button>
        <button class="control-btn" data-mode="mini" onclick="setMode('mini', this)">极简</button>
      </div>
    </div>

    <div class="control-group">
      <label>🎨 预设方案</label>
      <div class="control-row">
        <button class="control-btn active" onclick="applyPreset('default', this)">常规</button>
        <button class="control-btn" onclick="applyPreset('focus', this)">专注</button>
        <button class="control-btn" onclick="applyPreset('meeting', this)">会议</button>
        <button class="control-btn" onclick="applyPreset('minimal', this)">极简</button>
      </div>
    </div>

    <div class="control-group">
      <label>🔆 透明度 <span id="opacityVal">92%</span></label>
      <input type="range" min="35" max="100" value="92" oninput="setOpacity(this.value)">
    </div>

    <div class="control-group">
      <label>
        穿透模式
        <span class="badge badge-pass" id="passBadge" style="display:none">穿透中</span>
      </label>
      <div class="control-row">
        <button class="control-btn" id="passToggle" onclick="togglePassThrough()">开启穿透</button>
      </div>
    </div>

    <div class="control-group">
      <label>
        边缘吸附
        <span class="badge badge-dock" id="dockBadge" style="display:none">已贴边</span>
      </label>
      <div class="control-row">
        <button class="control-btn" id="dockToggle" onclick="toggleEdgeDock()">启用吸附</button>
      </div>
    </div>

    <div class="control-group">
      <label>⚡ 快捷操作</label>
      <div class="control-row">
        <button class="control-btn" onclick="addDemoNote()">➕ 添加示例</button>
        <button class="control-btn danger" onclick="resetNotes()">🗑 重置全部</button>
      </div>
    </div>

    <div class="control-group" style="margin-top:8px; padding-top:10px; border-top:1px solid var(--border)">
      <label style="color:var(--text-muted); font-size:11px">
        💡 右键卡片 → 上下文菜单<br>
        🖱 拖拽卡片 → 排序<br>
        ⌨ F3 → 切换显示
      </label>
    </div>
  </div>

</div>

<!-- ====== EDITOR MODAL ====== -->
<div id="editorOverlay" class="editor-overlay hidden" onclick="if(event.target===this)closeEditor()">
  <form class="editor-panel" onsubmit="event.preventDefault();saveEditor()">
    <header class="editor-header">
      <h2 id="editorTitle">新建便签</h2>
      <button type="button" class="icon-btn" onclick="closeEditor()">✕</button>
    </header>

    <label class="field full">
      <span>标题</span>
      <input id="editTitle" type="text" required placeholder="便签标题">
    </label>

    <div class="field-grid">
      <label class="field">
        <span>分类</span>
        <select id="editCategory">
          <option>工作</option><option>生活</option><option>学习</option><option>会议</option><option>其他</option>
        </select>
      </label>
      <label class="field">
        <span>颜色</span>
        <div class="color-dots" id="colorDots"></div>
      </label>
    </div>

    <div class="field-grid">
      <label class="field">
        <span>日期</span>
        <input id="editDate" type="date">
      </label>
      <label class="field">
        <span>时间</span>
        <input id="editTime" type="time" value="09:00">
      </label>
    </div>

    <label class="field full">
      <span>备注（支持 Markdown）</span>
      <textarea id="editContent" rows="5" placeholder="支持 **粗体** *斜体* `代码` 等 Markdown 语法"></textarea>
    </label>

    <footer class="editor-actions">
      <button type="button" class="btn btn-danger" id="editorDeleteBtn" style="display:none" onclick="deleteNote()">🗑 删除</button>
      <span></span>
      <button type="button" class="btn btn-secondary" onclick="closeEditor()">取消</button>
      <button type="submit" class="btn btn-primary">💾 保存</button>
    </footer>
  </form>
</div>

<!-- ====== CONTEXT MENU ====== -->
<div id="contextMenu" class="context-menu" onclick="event.stopPropagation()">
  <div class="context-item" onclick="ctxAction('edit')">✏️ 编辑</div>
  <div class="context-item" onclick="ctxAction('pin')">📌 置顶/取消</div>
  <div class="context-item" onclick="ctxAction('complete')">✅ 切换完成</div>
  <div class="context-sep"></div>
  <div class="context-item" onclick="ctxColor('red')"><span class="color-dot red"></span> 红色</div>
  <div class="context-item" onclick="ctxColor('orange')"><span class="color-dot orange"></span> 橙色</div>
  <div class="context-item" onclick="ctxColor('yellow')"><span class="color-dot yellow"></span> 黄色</div>
  <div class="context-item" onclick="ctxColor('green')"><span class="color-dot green"></span> 绿色</div>
  <div class="context-item" onclick="ctxColor('blue')"><span class="color-dot blue"></span> 蓝色</div>
  <div class="context-item" onclick="ctxColor('purple')"><span class="color-dot purple"></span> 紫色</div>
  <div class="context-item" onclick="ctxColor('')"><span class="color-dot def"></span> 默认</div>
  <div class="context-sep"></div>
  <div class="context-item danger" onclick="ctxAction('delete')">🗑 删除</div>
</div>

<script>
// ===== DATA =====
let notes = [
  { id:'1', title:'完成Q2工作报告', content:'需要包含**营收分析**、*用户增长*和团队总结\n\n- 营收：+23%\n- 用户：120万 MAU\n- 团队：扩招5人', category:'工作', date:'2026-06-25', time:'17:00', completed:false, pinned:true, remind:true, color:'blue', attachments:['财报数据.xlsx','汇报PPT.pdf'], order:1 },
  { id:'2', title:'周末超市采购', content:'- 🥛 牛奶 x2\n- 🍞 全麦面包\n- 🥚 鸡蛋一盒\n- 🍎 苹果', category:'生活', date:'2026-06-21', time:'10:00', completed:false, pinned:false, remind:false, color:'green', attachments:[], order:2 },
  { id:'3', title:'学习 Vue 3 Composable', content:'重点看 `useMouse`、`useEventListener` 的实现\n\n参考：[VueUse 文档](https://vueuse.org)', category:'学习', date:'2026-06-22', time:'20:00', completed:false, pinned:false, remind:true, color:'purple', attachments:['vueuse-guide.md'], order:3 },
  { id:'4', title:'周会讨论产品路线图', content:'议程：\n1. Q3 OKR 对齐\n2. 技术债清理计划\n3. 用户体验优化方案', category:'会议', date:'2026-06-23', time:'09:30', completed:true, pinned:false, remind:true, color:'red', attachments:[], order:4 },
  { id:'5', title:'整理书签和笔记', content:'把最近收藏的技术文章归档到 Notion', category:'其他', date:'2026-06-24', time:'15:00', completed:false, pinned:false, remind:false, color:'', attachments:[], order:5 }
];

let activeCategory = '全部';
let searchKeyword = '';
let editingId = null;
let ctxNoteId = null;
let dragState = { active:false, noteId:'', startIdx:-1, el:null, ghost:null, startY:0 };

const CATEGORIES = ['工作', '生活', '学习', '会议', '其他'];
const COLORS = ['', 'red', 'orange', 'yellow', 'green', 'blue', 'purple'];

// ===== RENDER =====
function getFilteredNotes() {
  let list = notes;
  if (activeCategory !== '全部') list = list.filter(n => n.category === activeCategory);
  if (searchKeyword.trim()) {
    const kw = searchKeyword.toLowerCase();
    list = list.filter(n => (n.title + ' ' + n.content).toLowerCase().includes(kw));
  }
  return [...list].sort((a, b) => {
    if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
    return a.order - b.order;
  });
}

function mdToHtml(text) {
  if (!text) return '';
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`(.+?)`/g, '<code style="background:var(--accent-soft);padding:1px 4px;border-radius:3px;font-family:monospace;font-size:11px">$1</code>')
    .replace(/^### (.+)/gm, '<strong style="font-size:13px">$1</strong>')
    .replace(/^- (.+)/gm, '<span style="display:block;padding-left:8px">• $1</span>')
    .replace(/^\d\. (.+)/gm, '<span style="display:block;padding-left:8px">$1</span>')
    .replace(/\n/g, '<br>');
}

function render() {
  const list = getFilteredNotes();
  const container = document.getElementById('noteList');
  const isMini = document.getElementById('appShell').classList.contains('mini-mode');

  container.innerHTML = list.length === 0
    ? '<div class="empty-state"><span style="font-size:30px">📝</span><p>没有便签</p></div>'
    : list.map(n => {
        const preview = isMini ? '' : (n.content ? `<div class="note-preview">${mdToHtml(n.content)}</div>` : '');
        const meta = isMini ? '' : `
          <div class="card-row card-meta">
            <span class="cat-pill">${n.category}</span>
            ${n.attachments.length ? `<span class="attach-pill">📎 ${n.attachments.length}</span>` : ''}
          </div>`;
        return `
          <article class="note-card ${n.completed ? 'completed' : ''} color-${n.color || ''}"
            data-id="${n.id}"
            draggable="true"
            onclick="openEditor('${n.id}')"
            oncontextmenu="showContextMenu(event, '${n.id}')"
            ondragstart="onDragStart(event, '${n.id}')"
            ondragend="onDragEnd(event)">
            <div class="card-row card-top">
              <button class="check-btn" title="切换完成" onclick="event.stopPropagation();toggleComplete('${n.id}')">${n.completed ? '✅' : '○'}</button>
              <button class="pin-btn ${n.pinned ? 'pinned' : ''}" title="置顶" onclick="event.stopPropagation();togglePin('${n.id}')">📌</button>
              <span class="card-title">${n.title}</span>
              <time>${n.time}</time>
            </div>
            ${preview}
            ${meta}
          </article>`;
      }).join('');

  document.getElementById('noteCount').textContent = `${list.length} 条`;
  document.getElementById('activeCatLabel').textContent = activeCategory;
  document.getElementById('todayLabel').textContent = new Intl.DateTimeFormat('zh-CN', { month:'2-digit', day:'2-digit', weekday:'short' }).format(new Date());
}

// ===== FILTERS =====
function filterNotes() {
  searchKeyword = document.getElementById('searchInput').value;
  render();
}

function setCategory(cat) {
  activeCategory = cat;
  document.querySelectorAll('#catTabs .control-btn').forEach(b => b.classList.toggle('active', b.textContent === cat));
  render();
}

// ===== EDITOR =====
function openEditor(id) {
  const note = id ? notes.find(n => n.id === id) : null;
  editingId = id || null;
  document.getElementById('editorTitle').textContent = id ? '编辑便签' : '新建便签';
  document.getElementById('editTitle').value = note?.title || '';
  document.getElementById('editCategory').value = note?.category || '工作';
  document.getElementById('editDate').value = note?.date || new Date().toISOString().split('T')[0];
  document.getElementById('editTime').value = note?.time || '09:00';
  document.getElementById('editContent').value = note?.content || '';
  document.getElementById('editorDeleteBtn').style.display = id ? 'flex' : 'none';

  // Color dots
  const selColor = note?.color || '';
  document.getElementById('colorDots').innerHTML = COLORS.map(c =>
    `<span class="color-dot ${c ? c : 'def'} ${c === selColor ? 'sel' : ''}" onclick="document.querySelectorAll('#colorDots .color-dot').forEach(d=>d.classList.remove('sel'));this.classList.add('sel')" data-color="${c}"></span>`
  ).join('');

  document.getElementById('editorOverlay').classList.remove('hidden');
  document.getElementById('editTitle').focus();
}

function closeEditor() {
  document.getElementById('editorOverlay').classList.add('hidden');
  editingId = null;
}

function saveEditor() {
  const title = document.getElementById('editTitle').value.trim();
  if (!title) return;
  const color = document.querySelector('#colorDots .color-dot.sel')?.dataset?.color || '';

  const payload = {
    title,
    category: document.getElementById('editCategory').value,
    date: document.getElementById('editDate').value,
    time: document.getElementById('editTime').value,
    content: document.getElementById('editContent').value,
    color
  };

  if (editingId) {
    const idx = notes.findIndex(n => n.id === editingId);
    if (idx !== -1) Object.assign(notes[idx], payload);
  } else {
    notes.unshift({
      id: Date.now().toString(),
      ...payload,
      completed: false, pinned: false, remind: true,
      attachments: [], order: Date.now()
    });
  }
  closeEditor();
  render();
}

function deleteNote() {
  if (!editingId) return;
  notes = notes.filter(n => n.id !== editingId);
  closeEditor();
  render();
}

// ===== ACTIONS =====
function toggleComplete(id) {
  const note = notes.find(n => n.id === id);
  if (!note) return;
  note.completed = !note.completed;
  render();
}

function togglePin(id) {
  const note = notes.find(n => n.id === id);
  if (!note) return;
  note.pinned = !note.pinned;
  render();
}

// ===== CONTEXT MENU =====
function showContextMenu(e, id) {
  e.preventDefault();
  ctxNoteId = id;
  const menu = document.getElementById('contextMenu');
  menu.style.left = e.clientX + 'px';
  menu.style.top = Math.min(e.clientY, window.innerHeight - 200) + 'px';
  menu.classList.add('show');
}
document.addEventListener('click', () => {
  document.getElementById('contextMenu').classList.remove('show');
});

function ctxAction(action) {
  const note = notes.find(n => n.id === ctxNoteId);
  if (!note) return;
  switch(action) {
    case 'edit': openEditor(ctxNoteId); break;
    case 'pin': togglePin(ctxNoteId); break;
    case 'complete': toggleComplete(ctxNoteId); break;
    case 'delete': notes = notes.filter(n => n.id !== ctxNoteId); render(); break;
  }
  document.getElementById('contextMenu').classList.remove('show');
}
function ctxColor(color) {
  const note = notes.find(n => n.id === ctxNoteId);
  if (note) { note.color = color; render(); }
  document.getElementById('contextMenu').classList.remove('show');
}

// ===== DRAG SORT =====
function onDragStart(e, id) {
  dragState.active = true;
  dragState.noteId = id;
  dragState.startIdx = notes.findIndex(n => n.id === id);
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', id);
  setTimeout(() => { e.target.style.opacity = '0.5'; }, 0);
}
function onDragEnd(e) {
  e.target.style.opacity = '1';
  dragState.active = false;
  render();
}

// Handle drop on note cards via delegation
document.getElementById('noteList').addEventListener('dragover', function(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
});
document.getElementById('noteList').addEventListener('drop', function(e) {
  e.preventDefault();
  const fromId = e.dataTransfer.getData('text/plain');
  const target = e.target.closest('.note-card');
  if (!target || !fromId) return;
  const toId = target.dataset.id;
  if (fromId === toId) return;

  const fromIdx = notes.findIndex(n => n.id === fromId);
  let toIdx = notes.findIndex(n => n.id === toId);
  if (fromIdx === -1 || toIdx === -1) return;

  const [moved] = notes.splice(fromIdx, 1);
  toIdx = notes.findIndex(n => n.id === toId);
  notes.splice(toIdx, 0, moved);

  // Reorder
  notes.forEach((n, i) => n.order = i);
  render();
});

// ===== MODE / PRESETS =====
function setMode(mode, btn) {
  const shell = document.getElementById('appShell');
  shell.classList.toggle('mini-mode', mode === 'mini');
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  render();
}

function applyPreset(preset, btn) {
  const shell = document.getElementById('appShell');
  const presets = {
    default: { mini: false, opacity: 0.92, passThrough: false },
    focus:   { mini: false, opacity: 1, passThrough: false },
    meeting: { mini: false, opacity: 0.72, passThrough: true },
    minimal: { mini: true, opacity: 0.48, passThrough: false }
  };
  const p = presets[preset];
  shell.classList.toggle('mini-mode', p.mini);
  shell.style.opacity = p.opacity;
  document.getElementById('opacityVal').textContent = Math.round(p.opacity * 100) + '%';
  document.getElementById('passToggle').textContent = p.passThrough ? '关闭穿透' : '开启穿透';
  document.getElementById('passBadge').style.display = p.passThrough ? 'inline-flex' : 'none';

  document.querySelectorAll('.control-panel .control-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  render();
}

function setOpacity(val) {
  document.getElementById('appShell').style.opacity = val / 100;
  document.getElementById('opacityVal').textContent = val + '%';
}

function togglePassThrough() {
  const badge = document.getElementById('passBadge');
  const btn = document.getElementById('passToggle');
  const isOn = badge.style.display !== 'none';
  if (isOn) {
    badge.style.display = 'none';
    btn.textContent = '开启穿透';
  } else {
    badge.style.display = 'inline-flex';
    btn.textContent = '关闭穿透';
  }
}

function toggleEdgeDock() {
  const badge = document.getElementById('dockBadge');
  const btn = document.getElementById('dockToggle');
  const isOn = badge.style.display !== 'none';
  if (isOn) {
    badge.style.display = 'none';
    btn.textContent = '启用吸附';
  } else {
    badge.style.display = 'inline-flex';
    btn.textContent = '禁用吸附';
  }
}

function toggleTheme() {
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
}

// ===== NLP QUICK CREATE =====
function quickCreate(text) {
  if (!text.trim()) return;
  let category = '工作';
  const catMatch = text.match(/#(工作|生活|学习|会议|其他)/);
  if (catMatch) { category = catMatch[1]; text = text.replace(catMatch[0], ''); }

  let date = new Date().toISOString().split('T')[0];
  if (text.includes('明天')) { const d = new Date(); d.setDate(d.getDate()+1); date = d.toISOString().split('T')[0]; }
  else if (text.includes('后天')) { const d = new Date(); d.setDate(d.getDate()+2); date = d.toISOString().split('T')[0]; }

  let time = '09:00';
  const timeMatch = text.match(/(\d{1,2})[:：点](\d{1,2})?/);
  if (timeMatch) {
    time = `${timeMatch[1].padStart(2,'0')}:${(timeMatch[2]||'00').padStart(2,'0')}`;
    text = text.replace(timeMatch[0], '');
  }

  const title = text.replace(/\s+/g, ' ').trim() || '新便签';
  notes.unshift({
    id: Date.now().toString(),
    title, content: '', category, date, time,
    completed: false, pinned: false, remind: true,
    color: '', attachments: [], order: Date.now()
  });
  document.getElementById('searchInput').value = '';
  searchKeyword = '';
  render();
}

// ===== DEMO =====

  const demos = [

    { title:'阅读《设计心理学》', content:'第三章：**本能层次设计**\n\n重点：\n- 视觉吸引力\n- 第一印象\n- 情感连接', category:'学习', color:'purple' },

function resetNotes() {
  if (!confirm('确定重置所有便签到初始演示数据？')) return;
  location.reload();
}

// ===== KEYBOARD =====
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!document.getElementById('editorOverlay').classList.contains('hidden')) closeEditor();
    else document.getElementById('contextMenu').classList.remove('show');
  }
  if (e.key === 'F3') {
    e.preventDefault();
    const shell = document.getElementById('appShell');
    shell.style.display = shell.style.display === 'none' ? '' : 'none';
  }
});

// ===== INIT =====
render();
document.getElementById('editDate').value = new Date().toISOString().split('T')[0];
